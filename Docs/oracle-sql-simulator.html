function buildSidebar() {
  var el = document.getElementById('tablesBody');
  var html = '';
  for (var t in TABLE_META) {
    if (!HR_DATA[t]) continue;
    var meta = TABLE_META[t];
    html += '<div class="table-item" data-table="' + t + '">' +
            '<span class="t-icon">▦</span><span class="t-name">' + t + '</span>' +
            '<span class="t-count">' + HR_DATA[t].length + '</span></div>';
    html += '<div class="col-list" id="cols-' + t + '" style="display:none">';
    for (var c = 0; c < meta.columns.length; c++) {
      var col = meta.columns[c];
      var mark = (col === meta.pk) ? '<span class="col-pk">PK</span>' :
                 (meta.fks[col] ? '<span class="col-fk">FK</span>' : '');
      html += '<div class="col-item" data-colname="' + col + '">' + mark + col + '</div>';
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

function insertAtCursor(text) {
  var ed = document.getElementById('sqlEditor');
  var s = ed.selectionStart, epos = ed.selectionEnd;
  ed.value = ed.value.substring(0, s) + text + ed.value.substring(epos);
  ed.selectionStart = ed.selectionEnd = s + text.length;
  ed.focus();
  refreshEditor();
}

function toggleSection(name) {
  var body = document.getElementById(name === 'tables' ? 'tablesBody' : 'savedBody');
  var arrow = document.getElementById(name === 'tables' ? 'tablesArrow' : 'savedArrow');
  var open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (open) arrow.classList.remove('open');
  else arrow.classList.add('open');
}

// ============================================================
// EDITOR (highlight, line numbers, keys)
// ============================================================
var SQL_KEYWORDS = ['SELECT','FROM','WHERE','AND','OR','NOT','NULL','IS','IN','LIKE','BETWEEN','EXISTS','AS','DISTINCT','UNIQUE','ALL','UNION','INTERSECT','EXCEPT','MINUS','GROUP','BY','HAVING','ORDER','ASC','DESC','JOIN','INNER','LEFT','RIGHT','FULL','OUTER','CROSS','NATURAL','ON','USING','CASE','WHEN','THEN','ELSE','END','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','DROP','ALTER','TABLE','VIEW','TRUNCATE','COMMIT','ROLLBACK','WITH','RECURSIVE','OVER','PARTITION','ROWS','RANGE','CURRENT','ROW','FETCH','OFFSET','LIMIT','ONLY','ANY','SOME','DUAL','PIVOT','UNPIVOT','START','CONNECT','PRIOR','LEVEL','ROWNUM','NULLS','FIRST','LAST','ESCAPE','TO'];
var SQL_FUNCTIONS = ['COUNT','SUM','AVG','MIN','MAX','UPPER','LOWER','INITCAP','LENGTH','SUBSTR','INSTR','ROUND','TRUNC','MOD','ABS','POWER','SQRT','TO_CHAR','TO_DATE','TO_NUMBER','NVL','NVL2','DECODE','COALESCE','NULLIF','LPAD','RPAD','REPLACE','TRANSLATE','TRIM','LTRIM','RTRIM','CONCAT','ADD_MONTHS','MONTHS_BETWEEN','LAST_DAY','NEXT_DAY','EXTRACT','SYSDATE','CURRENT_DATE','ROW_NUMBER','RANK','DENSE_RANK','LAG','LEAD','FIRST_VALUE','LAST_VALUE','LISTAGG','STDDEV','VARIANCE','MEDIAN','GREATEST','LEAST'];

var HL_RE = new RegExp(
  "('(?:[^']|'')*')" +
  "|(\\/\\*[\\s\\S]*?\\*\\/|--[^\\n]*)" +
  "|\\b(\\d+(?:\\.\\d+)?)\\b" +
  "|\\b(" + SQL_KEYWORDS.join('|') + ")\\b" +
  "|\\b(" + SQL_FUNCTIONS.join('|') + ")\\b",
  'g'
);

function highlightSQL(sql) {
  var escaped = sql.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return escaped.replace(HL_RE, function(m, s, c, num, kw, fn) {
    if (s) return '<span style="color:var(--sql-string)">' + s + '</span>';
    if (c) return '<span style="color:var(--sql-comment)">' + c + '</span>';
    if (num) return '<span style="color:var(--sql-number)">' + num + '</span>';
    if (kw) return '<span style="color:var(--sql-keyword)">' + kw + '</span>';
    if (fn) return '<span style="color:var(--sql-function)">' + fn + '</span>';
    return m;
  });
}

function refreshEditor() {
  var ed = document.getElementById('sqlEditor');
  var lines = ed.value.split('\n').length;
  var html = '';
  for (var i = 1; i <= lines; i++) html += '<div>' + i + '</div>';
  var ln = document.getElementById('lineNumbers');
  ln.innerHTML = html;
  ln.scrollTop = ed.scrollTop;
  document.getElementById('sqlHighlightCode').innerHTML = highlightSQL(ed.value);
  var hl = document.getElementById('sqlHighlight');
  hl.scrollTop = ed.scrollTop;
  hl.scrollLeft = ed.scrollLeft;
}

function formatQuery() {
  var ed = document.getElementById('sqlEditor');
  var sql = ed.value.trim();
  if (!sql) return;
  sql = sql.replace(/\s+/g, ' ');
  var kwRe = new RegExp('\\b(' + SQL_KEYWORDS.join('|') + '|' + SQL_FUNCTIONS.join('|') + ')\\b', 'gi');
  sql = sql.replace(kwRe, function(m) { return m.toUpperCase(); });
  sql = sql.replace(/\s+(FROM|WHERE|GROUP BY|HAVING|ORDER BY|UNION|INTERSECT|EXCEPT|MINUS|CONNECT BY|START WITH)\b/g,
    function(m, k) { return '\n' + k.toUpperCase(); });
  sql = sql.replace(/\s+(INNER JOIN|LEFT JOIN|LEFT OUTER JOIN|RIGHT JOIN|RIGHT OUTER JOIN|FULL JOIN|FULL OUTER JOIN|CROSS JOIN|JOIN)\b/g,
    function(m, k) { return '\n' + k.toUpperCase(); });
  sql = sql.replace(/,\s+/g, ',\n       ');
  ed.value = sql.trim();
  refreshEditor();
}

function clearEditor() {
  var ed = document.getElementById('sqlEditor');
  ed.value = '';
  refreshEditor();
  ed.focus();
  hideError();
}

function changeEditorFontSize(v) {
  document.getElementById('sqlEditor').style.fontSize = v + 'px';
  document.getElementById('sqlHighlight').style.fontSize = v + 'px';
  document.getElementById('lineNumbers').style.fontSize = v + 'px';
  try { localStorage.setItem('oracle-sim-font', v); } catch (e) {}
}

// ============================================================
// SAVED QUERIES
// ============================================================
function loadSaved() {
  try { return JSON.parse(localStorage.getItem('oracle-sim-saved') || '[]'); }
  catch (e) { return []; }
}

function saveQuery() {
  var ed = document.getElementById('sqlEditor');
  var sql = ed.value.trim();
  if (!sql) { showError('Saxlamaq üçün sorğu yazın.'); return; }
  var name = window.prompt('Sorğunun adı:', sql.substring(0, 40).replace(/\s+/g, ' '));
  if (name === null) return;
  if (!name.trim()) name = 'Sorğu ' + new Date().toLocaleTimeString();
  var list = loadSaved();
  list.unshift({ name: name.trim(), sql: sql });
  try { localStorage.setItem('oracle-sim-saved', JSON.stringify(list)); } catch (e) {}
  renderSaved();
}

function renderSaved() {
  var el = document.getElementById('savedBody');
  var list = loadSaved();
  if (!list.length) {
    el.innerHTML = '<div class="saved-empty">Saxlanmış sorğu yoxdur</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    html += '<div class="saved-item">' +
            '<div style="flex:1;min-width:0" data-load="' + i + '">' +
            '<div class="sq-name">' + escapeHtml(list[i].name) + '</div>' +
            '<div class="sq-sql">' + escapeHtml(list[i].sql) + '</div></div>' +
            '<button class="sq-delete" data-del="' + i + '">×</button></div>';
  }
  el.innerHTML = html;
}

// ============================================================
// THEME + RESIZERS
// ============================================================
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeIconDark').style.display = theme === 'dark' ? 'block' : 'none';
  document.getElementById('themeIconLight').style.display = theme === 'light' ? 'block' : 'none';
}

function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  var next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('oracle-sim-theme', next); } catch (e) {}
}

function initResizers() {
  var sr = document.getElementById('sidebarResizer');
  sr.addEventListener('mousedown', function(e) {
    e.preventDefault();
    sr.classList.add('active');
    function mm(ev) {
      var w = Math.min(460, Math.max(170, ev.clientX));
      document.getElementById('sidebar').style.width = w + 'px';
    }
    function mu() {
      sr.classList.remove('active');
      document.removeEventListener('mousemove', mm);
      document.removeEventListener('mouseup', mu);
    }
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });

  var rz = document.getElementById('resizer');
  rz.addEventListener('mousedown', function(e) {
    e.preventDefault();
    rz.classList.add('active');
    var wrap = document.getElementById('editorWrap');
    var startY = e.clientY;
    var startH = wrap.getBoundingClientRect().height;
    function mm(ev) {
      var h = Math.min(window.innerHeight - 160, Math.max(100, startH + (ev.clientY - startY)));
      wrap.style.flex = '0 0 ' + h + 'px';
    }
    function mu() {
      rz.classList.remove('active');
      document.removeEventListener('mousemove', mm);
      document.removeEventListener('mouseup', mu);
    }
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });
}

// ============================================================
// BOOTSTRAP
// ============================================================
window.addEventListener('load', function() {
  var ed = document.getElementById('sqlEditor');
  ed.addEventListener('input', refreshEditor);
  ed.addEventListener('scroll', function() {
    var hl = document.getElementById('sqlHighlight');
    hl.scrollTop = ed.scrollTop;
    hl.scrollLeft = ed.scrollLeft;
    document.getElementById('lineNumbers').scrollTop = ed.scrollTop;
  });
  ed.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      insertAtCursor('  ');
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      executeQuery();
    }
  });

  document.getElementById('resultsTabs').addEventListener('click', function(e) {
    var t = e.target;
    while (t && t !== this && !t.getAttribute('data-close') && !t.getAttribute('data-idx')) t = t.parentElement;
    if (!t || t === this) return;
    if (t.getAttribute('data-close') !== null && t.getAttribute('data-close') !== undefined && t.classList.contains('tab-close')) {
      closeTab(parseInt(t.getAttribute('data-close'), 10));
      return;
    }
    var idx = t.getAttribute('data-idx');
    if (idx !== null && idx !== undefined) showTab(parseInt(idx, 10));
  });

  document.getElementById('tablesBody').addEventListener('click', function(e) {
    var t = e.target;
    while (t && t !== this && !t.getAttribute('data-table') && !t.getAttribute('data-colname')) t = t.parentElement;
    if (!t || t === this) return;
    var tb = t.getAttribute('data-table');
    if (tb !== null && tb !== undefined) {
      var cl = document.getElementById('cols-' + tb);
      if (cl) cl.style.display = cl.style.display === 'none' ? 'block' : 'none';
      return;
    }
    var cn = t.getAttribute('data-colname');
    if (cn !== null && cn !== undefined) insertAtCursor(cn);
  });

  document.getElementById('savedBody').addEventListener('click', function(e) {
    var t = e.target;
    while (t && t !== this && !t.getAttribute('data-load') && !t.getAttribute('data-del')) t = t.parentElement;
    if (!t || t === this) return;
    var del = t.getAttribute('data-del');
    if (del !== null && del !== undefined) {
      var list = loadSaved();
      list.splice(parseInt(del, 10), 1);
      try { localStorage.setItem('oracle-sim-saved', JSON.stringify(list)); } catch (err) {}
      renderSaved();
      return;
    }
    var load = t.getAttribute('data-load');
    if (load !== null && load !== undefined) {
      var item = loadSaved()[parseInt(load, 10)];
      if (item) {
        document.getElementById('sqlEditor').value = item.sql;
        refreshEditor();
      }
    }
  });

  var theme = 'dark';
  try { theme = localStorage.getItem('oracle-sim-theme') || 'dark'; } catch (e) {}
  applyTheme(theme);

  try {
    var f = localStorage.getItem('oracle-sim-font');
    if (f) {
      document.getElementById('fontSizeSelect').value = f;
      changeEditorFontSize(f);
    }
  } catch (e) {}

  renderSaved();
  refreshEditor();
  initResizers();
