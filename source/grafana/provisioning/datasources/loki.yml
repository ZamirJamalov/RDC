# PR #290: Grafana datasource avtomatik proviziyası — Loki əl ilə əlavə etmək lazım deyil.
# docker compose up -d → Grafana açılanda Loki artıq default datasource-dur.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
