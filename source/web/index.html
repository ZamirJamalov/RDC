<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDC — Muraciet Siyahisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/auth.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        /* PR #176: AZMK fonts — Geist for headings/numbers, Geist Mono for calculator */
        h1, h2, h3, h4, h5, h6,
        .font-extrabold, .font-black,
        .gradient-text, .gradient-accent-text,
        .calc-num, .num-shift,
        .alpul-grad-text {
            font-family: 'Geist', 'IBM Plex Sans', sans-serif;
        }
        .font-mono, .tabular-nums, input[type="number"], input[inputmode="decimal"], input[inputmode="numeric"] {
            font-family: 'Geist Mono', 'IBM Plex Sans', monospace;
            font-variant-numeric: tabular-nums;
        }
        .alpul-btn { background: linear-gradient(135deg, #2D9CDB 0%, #1d5a8f 100%); }
        .alpul-btn:hover { box-shadow: 0 4px 12px rgba(45, 156, 219, 0.4); }

        /* PR #83: Theme variables */
        [data-theme="light"] {
            --bg: #F0F4F8;
            --card: #FFFFFF;
            --text: #1E293B;
            --text-soft: #64748B;
            --border: #E2E8F0;
        }
        /* PR #509: dark theme silindi — RDC həmişə light */
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="appList()" x-init="init()" x-cloak data-theme="light">

    <!-- PR #142: Auth check loading screen -->
    <div x-show="authChecking" class="fixed inset-0 flex items-center justify-center bg-gray-50">
        <div class="text-gray-500">Yoxlanılır...</div>
    </div>

    <div x-show="!authChecking" x-cloak class="max-w-4xl mx-auto py-8 px-4">

        <!-- Header -->
        <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
            <div class="flex items-center gap-3">
                <a href="/index.html"><img src="/assets/alpul-logo.png" alt="ALPUL" class="w-24 h-24 object-contain"></a>
                <h1 class="text-2xl font-bold text-gray-800">RDC — Muraciet Siyahısı</h1>
            </div>
            <div class="flex items-center gap-3">
                <!-- PR #142: User info -->
                <div class="flex items-center gap-2 text-sm">
                    <div class="w-8 h-8 rounded-full bg-teal-500/20 border border-teal-500/30 flex items-center justify-center font-bold text-teal-600 text-xs"
                         x-text="currentUser ? currentUser.username.charAt(0).toUpperCase() : '?'"></div>
                    <div class="hidden sm:block">
                        <div class="font-medium text-gray-800" x-text="currentUser?.username"></div>
                        <div class="text-xs text-gray-500" x-text="currentUser?.role === 'admin' ? 'Admin' : 'Ekspert'"></div>
                    </div>
                </div>
                <!-- PR #142: Admin panel link (admin only) -->
                <a x-show="currentUser?.role === 'admin'" href="/admin"
                   class="text-sm px-3 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition"
                   title="İstifadəçi idarəetməsi">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                </a>
                <!-- PR #509: theme toggle silindi — RDC həmişə light theme -->
                <button @click="load()" class="alpul-btn text-white px-4 py-2 rounded-lg font-medium transition">
                    Yenile
                </button>
                <!-- PR #142: Logout button -->
                <button @click="logout()" class="px-3 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-red-50 hover:border-red-300 hover:text-red-600 transition text-sm font-medium"
                        title="Çıxış">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </button>
            </div>
        </div>

        <!-- PR #421/#422: Xarici servis sağlamlığı — YALNIZ ADMIN (ekspert görmür) -->
        <div x-show="currentUser?.role === 'admin'" x-cloak class="mb-4 rounded-xl border border-gray-200 bg-white overflow-hidden">
            <button @click="healthOpen = !healthOpen" class="w-full flex items-center justify-between px-4 py-2.5 hover:bg-gray-50 transition">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-semibold text-gray-700">Xarici servis sağlamlığı</span>
                    <!-- Ümumi status xülasəsi -->
                    <span x-show="healthLoaded && healthErrorCount() === 0" class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-medium">hamısı işləyir</span>
                    <span x-show="healthLoaded && healthErrorCount() > 0" class="text-[11px] px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 font-medium" x-text="healthErrorCount() + ' servis xətada'"></span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[11px] text-gray-400" x-text="healthUpdated ? 'yeni: ' + healthUpdated : ''"></span>
                    <svg class="w-4 h-4 text-gray-400 transition-transform" :class="healthOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
            </button>
            <div x-show="healthOpen" x-cloak class="px-4 pb-4 pt-1 border-t border-gray-100">
                <div x-show="!healthLoaded" class="text-xs text-gray-400 py-2">Yüklənir...</div>
                <div x-show="healthLoaded && services.length === 0" class="text-xs text-gray-400 py-2">Son 24 saatda xarici çağırış yoxdur</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
                    <template x-for="s in services" :key="s.service_name">
                        <div class="rounded-lg border p-2.5"
                             :class="s.status === 'error' ? 'border-rose-200 bg-rose-50' : s.status === 'ok' ? 'border-emerald-200 bg-emerald-50' : 'border-gray-200 bg-gray-50'">
                            <div class="flex items-center gap-1.5 mb-1">
                                <span class="w-2 h-2 rounded-full shrink-0"
                                      :class="s.status === 'error' ? 'bg-rose-500 animate-pulse' : s.status === 'ok' ? 'bg-emerald-500' : 'bg-gray-400'"></span>
                                <span class="text-[11px] font-semibold text-gray-700 truncate" x-text="s.service_name" :title="s.service_name"></span>
                            </div>
                            <div class="text-[10px] text-gray-500 space-y-0.5">
                                <div x-show="s.last_success_at">✓ <span x-text="fmtTime(s.last_success_at)"></span></div>
                                <div x-show="s.last_failure_at" class="text-rose-600">✗ <span x-text="fmtTime(s.last_failure_at)"></span><span x-show="s.last_failure_app_id" class="ml-1 font-semibold">· №<span x-text="s.last_failure_app_id"></span></span></div>
                                <div><span x-text="s.ok_calls"></span>/<span x-text="s.total_calls"></span> uğurlu · <span x-text="s.avg_duration_ms"></span>ms</div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- PR #313: Tab filter — Gözləyən / İmtina olunmuş / Uğurla verilənlər (PR #376) -->
        <div class="flex gap-2 mb-4">
            <button @click="switchTab('pending')"
                    :class="tab === 'pending' ? 'alpul-btn text-white' : 'border border-gray-300 text-gray-600 hover:bg-gray-100'"
                    class="px-4 py-2 rounded-lg text-sm font-medium transition">
                Gözləyən
            </button>
            <button @click="switchTab('rejected')"
                    :class="tab === 'rejected' ? 'bg-red-500 text-white' : 'border border-gray-300 text-gray-600 hover:bg-gray-100'"
                    class="px-4 py-2 rounded-lg text-sm font-medium transition">
                İmtina olunmuş
            </button>
            <button @click="switchTab('approved')"
                    :class="tab === 'approved' ? 'bg-green-500 text-white' : 'border border-gray-300 text-gray-600 hover:bg-gray-100'"
                    class="px-4 py-2 rounded-lg text-sm font-medium transition">
                Uğurla verilənlər
            </button>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="text-center py-8 text-gray-500">
            Yuklenir...
        </div>

        <!-- Error -->
        <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" x-text="error">
        </div>

        <!-- Empty -->
        <div x-show="!loading && !error && applications.length === 0" class="text-center py-8 text-gray-500"
             x-text="tab === 'rejected' ? 'Heç bir imtina olunmuş muraciet yoxdur.' : tab === 'approved' ? 'Heç bir uğurla verilmiş muraciet yoxdur.' : 'Heç bir muraciet yoxdur.'">
        </div>

        <!-- Application List -->
        <div x-show="!loading && applications.length > 0" class="space-y-4">
            <template x-for="app in applications" :key="app.public_id">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 hover:shadow-md hover:border-teal-300 transition-all cursor-pointer"
                     @click="window.location.href='/detail?id=' + app.public_id">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <!-- PR #237: full name boş olanda '-' göstər (detail.html pattern-i ilə eyni) -->
                                <span class="font-semibold text-lg text-gray-800" x-text="app.customer_full_name || '-'"></span>
                            </div>
                            <div class="text-sm text-gray-500 space-y-1">
                                <p><span class="font-medium">PIN:</span> <span x-text="app.customer_pin"></span></p>
                                <p><span class="font-medium">Mebleg:</span> <span x-text="(app.total_amount || app.amount) + ' AZN'"></span></p>
                                <p><span class="font-medium">Muddet:</span> <span x-text="app.term_months + ' ay'"></span></p>
                                <!-- PR #376: müraciət tarixi + baxılma tarixi (bütün tab-larda) -->
                                <p><span class="font-medium">Müraciət tarixi:</span> <span x-text="fmtDate(app.created_at)"></span></p>
                                <p><span class="font-medium">Baxılma tarixi:</span> <span x-text="fmtDate(app.updated_at)"></span></p>
                                <!-- PR #142: Processed by display -->
                                <p x-show="app.processed_by_username" class="text-xs text-gray-400 mt-1">
                                    <span class="font-medium">İşləyən:</span> <span x-text="app.processed_by_username"></span>
                                </p>
                                <!-- PR #313: İmtina səbəbi (rejected tab-da) -->
                                <p x-show="app.rejection_reason" class="text-xs text-red-600 mt-1">
                                    <span class="font-medium">İmtina səbəbi:</span> <span x-text="app.rejection_reason"></span>
                                </p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="inline-block px-3 py-1 rounded-full text-sm font-medium"
                                  :class="{
                                      'bg-yellow-100 text-yellow-800': app.status === 'pending_approval',
                                      'bg-green-100 text-green-800': app.status === 'approved',
                                      'bg-red-100 text-red-800': app.status === 'rejected',
                                      'bg-teal-100 text-teal-800': app.status === 'pending' || app.status === 'checking' || app.status === 'pending_expert' || app.status === 'pending_customer',
                                      'bg-indigo-100 text-indigo-800': app.status === 'pending_signature',
                                      'bg-blue-100 text-blue-800': app.status === 'disbursed',
                                      'bg-orange-100 text-orange-800': app.status === 'disbursing',
                                      'bg-red-100 text-red-700': app.status === 'disburse_failed',
                                      'bg-gray-200 text-gray-700': app.status === 'cancelled'
                                  }"
                                  x-text="statusAz(app.status)">
                            </span>
                            <p class="text-sm text-gray-400 mt-2" x-text="app.credit_level ? ('Səviyyə: ' + levelAz(app.credit_level)) : ''"></p>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script>
        function appList() {
            return {
                applications: [],
                loading: false,
                error: '',
                tab: 'pending', // PR #313: 'pending' | 'rejected' | 'approved' (PR #376)
                authChecking: true,
                currentUser: null,
                // PR #509: theme state silindi — RDC həmişə light

                // PR #421: xarici servis sağlamlığı
                healthOpen: false,
                healthLoaded: false,
                healthUpdated: '',
                services: [],
                healthTimer: null,

                async init() {
                    // PR #509: initTheme silindi — RDC həmişə light (data-theme="light" body-də sabit)
                    // PR #442: URL-dən tab parametri (?tab=rejected kimi) —
                    // reject-dən sonra birbaşa imtina siyahısına yönləndirmə üçün
                    const t = new URLSearchParams(location.search).get('tab');
                    if (['pending', 'rejected', 'approved'].includes(t)) this.tab = t;
                    // PR #142: Check auth before loading
                    await this.checkAuth();
                    if (this.currentUser) {
                        this.load();
                        // PR #422: sağlamlıq paneli yalnız admin — ekspert üçün yükləmə YOX
                        if (this.currentUser.role === 'admin') {
                            this.loadHealth();
                            this.healthTimer = setInterval(() => this.loadHealth(), 60000);
                        }
                    }
                },

                // PR #421/#422: servis sağlamlığı — YALNIZ ADMIN (backend də admin-only):
                // /api/admin/service-health (son 24 saat)
                async loadHealth() {
                    try {
                        const resp = await fetch('/api/admin/service-health?hours=24');
                        if (!resp.ok) return;
                        const data = await resp.json();
                        this.services = data.services || [];
                        this.healthLoaded = true;
                        // PR #509: yenilənmə vaxtı da Bakı (UTC+4) tz-də göstərilir
                        this.healthUpdated = new Date().toLocaleTimeString('az', {hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Asia/Baku'});
                    } catch (e) { /* fail-soft — panel boş qalır */ }
                },
                healthErrorCount() {
                    return this.services.filter(s => s.status === 'error').length;
                },
                fmtTime(iso) {
                    if (!iso) return '—';
                    // PR #509: həmişə Bakı vaxtı (UTC+4) — server UTC yazır, browser
                    // TZ-dən asılı olmayaraq göstərici deterministik olsun.
                    return new Date(iso).toLocaleTimeString('az', {hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Asia/Baku'});
                },

                // PR #509: initTheme/toggleTheme silindi — RDC həmişə light theme.

                // PR #142: Auth check
                async checkAuth() {
                    try {
                        const resp = await fetch('/api/auth/me');
                        if (resp.status === 401) {
                        window.clearAuthToken();
                            window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                            return;
                        }
                        if (!resp.ok) throw new Error('Auth yoxlanıla bilmədi');
                        this.currentUser = await resp.json();
                        // PR #497: authChecking yalnız uğurda söndürülür. Əvvəl finally-də
                        // söndürülürdü — login redirect-i gedərkən dashboard 1 san görünürdü (flash).
                        this.authChecking = false;
                    } catch (e) {
                        window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                        return;
                    }
                },

                // PR #142: Logout
                async logout() {
                    try {
                        await fetch('/api/auth/logout', { method: 'POST' });
                    window.clearAuthToken();
                    } catch (e) { /* ignore */ }
                    window.location.href = '/login';
                },

                // PR #313: tab keçidi
                switchTab(t) {
                    if (this.tab === t) return;
                    this.tab = t;
                    this.load();
                },

                async load() {
                    this.loading = true;
                    this.error = '';
                    try {
                        // PR #313: rejected tab → ?status=rejected
                        // PR #376: approved tab → ?status=approved (approved + disbursed)
                        const url = this.tab === 'rejected' ? '/api/expert/queue?status=rejected'
                                  : this.tab === 'approved' ? '/api/expert/queue?status=approved'
                                  : '/api/expert/queue';
                        const resp = await fetch(url);
                        if (resp.status === 401) {
                        window.clearAuthToken();
                            window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                            return;
                        }
                        if (!resp.ok) throw new Error('Sorgu ugursuz: ' + resp.status);
                        const data = await resp.json();
                        this.applications = data.applications || [];
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>

    <script>
        // PR #313: status Azərbaycanca (badge-də raw status yerinə)
        function statusAz(status) {
            const map = {
                'pending': 'Gözləyir',
                'checking': 'Yoxlanılır',
                'pending_customer': 'Müştəri gözləyir',
                'pending_expert': 'Ekspert gözləyir',
                'pending_approval': 'Təsdiq gözləyir',
                'approved': 'Təsdiqləndi',
                'rejected': 'İmtina olunmuş',
                'pending_signature': 'İmza gözləyir',
                'disbursing': 'Köçürülür',
                'disbursed': 'Köçürülüb',
                'disburse_failed': 'Köçürmə xətası'
            };
            return map[status] || status;
        }

        // PR #376: tarix formatı — dd.mm.yyyy HH:MM:SS (detail.html toLocaleString pattern-i)
        function fmtDate(s) {
            if (!s) return '-';
            // MSSQL "2026-09-03 14:49:31.9" → ISO "2026-09-03T14:49:31.9" (Safari üçün)
            const d = new Date(String(s).replace(' ', 'T'));
            return isNaN(d) ? s : d.toLocaleString('az');
        }

        // PR #236: kredit level Azərbaycanca — backend kiçik hərflə qaytarır ('valuable'),
        // ona görə lookup öncə toUpperCase ilə normallaşdırılır (regressiya düzəlişi PR #234-dən)
        function levelAz(level) {
            const map = {
                'NEW': 'Yeni',
                'TRUSTED': 'Etibarlı',
                'VALUABLE': 'Dəyərli',
                'ELITE': 'Elit'
            };
            return map[String(level || '').toUpperCase()] || level;
        }
    </script>
</body>
</html>
