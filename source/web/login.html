<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPUL — Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --alpul-bg: #0a0b14;
            --alpul-card: #12141f;
            --alpul-border: #1e2130;
            --alpul-text: #e2e8f0;
            --alpul-text-soft: #94a3b8;
            --alpul-input-bg: #0f111a;
            --alpul-teal: #3FB0A7;
            --alpul-indigo: #6163A4;
        }
        [data-theme="light"] {
            --alpul-bg: #f8fafc;
            --alpul-card: #ffffff;
            --alpul-border: #e2e8f0;
            --alpul-text: #1e293b;
            --alpul-text-soft: #64748b;
            --alpul-input-bg: #f1f5f9;
        }
        * { font-family: 'Inter', sans-serif; }
        body { background: var(--alpul-bg); color: var(--alpul-text); }
        .gradient-accent { background: linear-gradient(135deg, #3FB0A7 0%, #6163A4 100%); }
        .gradient-text { background: linear-gradient(135deg, #3FB0A7 0%, #6163A4 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .input-field {
            background: var(--alpul-input-bg);
            border: 1px solid var(--alpul-border);
            color: var(--alpul-text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #3FB0A7;
            box-shadow: 0 0 0 3px rgba(63, 176, 167, 0.15);
        }
        .input-field::placeholder { color: var(--alpul-text-soft); opacity: 0.5; }
        .cta-btn { background: linear-gradient(135deg, #3FB0A7 0%, #6163A4 100%); transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .cta-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(63, 176, 167, 0.3); }
        .cta-btn:active:not(:disabled) { transform: translateY(0); }
        .cta-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        [x-cloak] { display: none !important; }
        .spinner { border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.6s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body x-data="loginApp()" x-init="init()" x-cloak data-theme="dark">

<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 mb-2">
                <div class="w-12 h-12 rounded-xl gradient-accent flex items-center justify-center font-black text-white text-2xl">A</div>
                <span class="text-2xl font-bold tracking-tight">ALPUL</span>
            </div>
            <p class="text-sm text-[var(--alpul-text-soft)]">RDC Dashboard</p>
        </div>

        <!-- Login card -->
        <div class="rounded-2xl p-6 sm:p-8" style="background: var(--alpul-card); border: 1px solid var(--alpul-border);">
            <h1 class="text-xl font-bold mb-1">Giriş</h1>
            <p class="text-sm text-[var(--alpul-text-soft)] mb-6">Dashboard-a daxil olmaq üçün istifadəçi adı və şifrənizi daxil edin.</p>

            <!-- Error message -->
            <div x-show="error" x-transition class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
                <span x-text="error"></span>
            </div>

            <form @submit.prevent="login()" class="space-y-4">
                <!-- Username -->
                <div>
                    <label class="text-sm text-[var(--alpul-text-soft)] mb-1.5 block">İstifadəçi adı</label>
                    <input type="text"
                           x-model="username"
                           :disabled="loading"
                           autocomplete="username"
                           placeholder="admin"
                           class="input-field w-full px-4 py-3 rounded-xl text-base font-medium"
                           @keydown.enter="login()">
                </div>

                <!-- Password -->
                <div>
                    <label class="text-sm text-[var(--alpul-text-soft)] mb-1.5 block">Şifrə</label>
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'"
                               x-model="password"
                               :disabled="loading"
                               autocomplete="current-password"
                               placeholder="••••••"
                               class="input-field w-full px-4 py-3 pr-10 rounded-xl text-base font-medium"
                               @keydown.enter="login()">
                        <button type="button"
                                @click="showPassword = !showPassword"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--alpul-text-soft)] hover:text-[var(--alpul-text)] transition"
                                tabindex="-1">
                            <svg x-show="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            <svg x-show="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit"
                        :disabled="loading || !username || !password"
                        class="cta-btn w-full text-white font-semibold py-3.5 rounded-xl text-base flex items-center justify-center gap-2">
                    <span x-show="!loading" class="flex items-center gap-2">
                        Daxil ol
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                    </span>
                    <span x-show="loading" class="flex items-center gap-2">
                        <span class="spinner"></span>
                        Yoxlanılır...
                    </span>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
            <a href="/landing.html" class="text-sm text-[var(--alpul-text-soft)] hover:text-[var(--alpul-teal)] transition">
                ← Ana səhifəyə qayıt
            </a>
        </div>
    </div>
</div>

<script>
function loginApp() {
    return {
        username: '',
        password: '',
        showPassword: false,
        loading: false,
        error: '',
        redirect: '',

        init() {
            // Check if already logged in
            this.checkAuth();
            // Get redirect param
            const params = new URLSearchParams(window.location.search);
            this.redirect = params.get('redirect') || '/index.html';
        },

        async checkAuth() {
            try {
                const resp = await fetch('/api/auth/me');
                if (resp.ok) {
                    // Already logged in — redirect
                    window.location.href = this.redirect;
                }
            } catch (e) { /* not logged in */ }
        },

        async login() {
            this.loading = true;
            this.error = '';
            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: this.username.trim(),
                        password: this.password,
                    }),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    this.error = data.error || 'Giriş uğursuz';
                    return;
                }
                // Success — redirect
                window.location.href = this.redirect;
            } catch (e) {
                this.error = 'Bağlantı xətası. Yenidən cəhd edin.';
            } finally {
                this.loading = false;
            }
        },
    };
}
</script>

</body>
</html>
