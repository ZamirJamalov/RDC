<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPUL — İstifadəçi İdarəetməsi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/auth.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        /* PR #176: AZMK fonts — Geist for headings/numbers, Geist Mono for calculator */
        h1, h2, h3, h4, h5, h6,
        .font-extrabold, .font-black,
        .gradient-text, .gradient-accent-text,
        .calc-num, .num-shift,
        .alpul-grad-text {
            font-family: 'Geist', 'IBM Plex Sans', sans-serif;
        }
        .font-mono, .tabular-nums, input[type="number"], input[inputmode="decimal"], input[inputmode="numeric"] {
            font-family: 'Geist Mono', 'IBM Plex Sans', monospace;
            font-variant-numeric: tabular-nums;
        }
        .alpul-btn { background: linear-gradient(135deg, #2D9CDB 0%, #1d5a8f 100%); }
        .alpul-btn:hover { box-shadow: 0 4px 12px rgba(45, 156, 219, 0.4); }

        [data-theme="light"] {
            --bg: #F0F4F8; --card: #FFFFFF; --text: #1E293B; --text-soft: #64748B; --border: #E2E8F0;
        }
        [data-theme="dark"] {
            --bg: #081a33; --card: #112d52; --text: #F5F5F7; --text-soft: #A3B3CC; --border: #1d3b66;
        }
        [data-theme="dark"] body { background: var(--bg) !important; }
        [data-theme="dark"] .bg-white { background: var(--card) !important; }
        [data-theme="dark"] .text-gray-800 { color: var(--text) !important; }
        [data-theme="dark"] .text-gray-600 { color: var(--text-soft) !important; }
        [data-theme="dark"] .text-gray-500 { color: var(--text-soft) !important; }
        [data-theme="dark"] .border-gray-200 { border-color: var(--border) !important; }
        .input-field {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            transition: border-color 0.2s ease;
        }
        .input-field:focus { outline: none; border-color: #2D9CDB; box-shadow: 0 0 0 3px rgba(45, 156, 219, 0.15); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="adminPanel()" x-init="init()" x-cloak data-theme="light">

    <!-- Auth check loading -->
    <div x-show="authChecking" class="fixed inset-0 flex items-center justify-center bg-gray-50">
        <div class="text-gray-500">Yoxlanılır...</div>
    </div>

    <div x-show="!authChecking && currentUser?.role === 'admin'" x-cloak class="max-w-5xl mx-auto py-8 px-4">

        <!-- Header -->
        <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
            <div class="flex items-center gap-3">
                <a href="/dashboard" class="text-teal-600 hover:text-teal-800 transition text-sm font-medium flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Siyahı
                </a>
                <div class="h-6 w-px bg-gray-300"></div>
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 rounded-xl alpul-btn flex items-center justify-center font-black text-white text-lg">A</div>
                    <h1 class="text-2xl font-bold text-gray-800">İstifadəçi İdarəetməsi</h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-500" x-text="'Giriş: ' + (currentUser?.username || '')"></span>
                <button @click="toggleTheme()" class="w-9 h-9 rounded-lg border border-gray-300 flex items-center justify-center hover:bg-gray-100 transition" title="Theme dəyiş">
                    <svg x-show="theme === 'light'" class="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
                    <svg x-show="theme === 'dark'" class="w-5 h-5 text-indigo-400" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                </button>
                <button @click="logout()" class="px-3 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-red-50 hover:border-red-300 hover:text-red-600 transition text-sm font-medium" title="Çıxış">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </button>
            </div>
        </div>

        <!-- Create user button -->
        <div class="mb-4">
            <button @click="showCreateModal = true" class="alpul-btn text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                Yeni istifadəçi
            </button>
        </div>

        <!-- Error/Success messages -->
        <div x-show="error" x-transition class="mb-4 p-3 rounded-lg bg-red-100 border border-red-400 text-red-700 text-sm" x-text="error"></div>
        <div x-show="success" x-transition class="mb-4 p-3 rounded-lg bg-green-100 border border-green-400 text-green-700 text-sm" x-text="success"></div>

        <!-- Loading -->
        <div x-show="loading" class="text-center py-8 text-gray-500">Yüklənir...</div>

        <!-- Users table -->
        <div x-show="!loading" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="text-left px-4 py-3 font-semibold text-gray-600">ID</th>
                            <th class="text-left px-4 py-3 font-semibold text-gray-600">İstifadəçi adı</th>
                            <th class="text-left px-4 py-3 font-semibold text-gray-600">Rol</th>
                            <th class="text-left px-4 py-3 font-semibold text-gray-600">Status</th>
                            <th class="text-left px-4 py-3 font-semibold text-gray-600 hidden sm:table-cell">Son giriş</th>
                            <th class="text-left px-4 py-3 font-semibold text-gray-600 hidden md:table-cell">Yaradılıb</th>
                            <th class="text-right px-4 py-3 font-semibold text-gray-600">Əməliyyatlar</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <template x-for="u in users" :key="u.id">
                            <tr class="hover:bg-gray-50">
                                <td class="px-4 py-3 text-gray-500" x-text="u.id"></td>
                                <td class="px-4 py-3 font-medium text-gray-800" x-text="u.username"></td>
                                <td class="px-4 py-3">
                                    <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                                          :class="u.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'"
                                          x-text="u.role === 'admin' ? 'Admin' : 'Ekspert'"></span>
                                </td>
                                <td class="px-4 py-3">
                                    <div class="flex flex-col gap-1">
                                        <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium w-fit"
                                              :class="u.is_active ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-600'"
                                              x-text="u.is_active ? 'Aktiv' : 'Deaktiv'"></span>
                                        <span x-show="u.is_locked" class="inline-block px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 w-fit">
                                            Bloklanıb
                                        </span>
                                    </div>
                                </td>
                                <td class="px-4 py-3 text-gray-500 text-xs hidden sm:table-cell" x-text="u.last_login_at ? new Date(u.last_login_at).toLocaleString('az') : '-'"></td>
                                <td class="px-4 py-3 text-gray-500 text-xs hidden md:table-cell" x-text="u.created_at ? new Date(u.created_at).toLocaleDateString('az') : '-'"></td>
                                <td class="px-4 py-3">
                                    <div class="flex items-center justify-end gap-1 flex-wrap">
                                        <!-- Role toggle -->
                                        <button @click="toggleRole(u)" :disabled="u.id === currentUser?.id"
                                                class="text-xs px-2 py-1 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed transition"
                                                :title="u.role === 'admin' ? 'Ekspertə çevir' : 'Adminə çevir'">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                                        </button>
                                        <!-- Lock/Unlock -->
                                        <button x-show="!u.is_locked" @click="lockUser(u)" :disabled="u.id === currentUser?.id"
                                                class="text-xs px-2 py-1 rounded border border-gray-300 text-orange-600 hover:bg-orange-50 disabled:opacity-30 disabled:cursor-not-allowed transition"
                                                title="Blokla">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                        </button>
                                        <button x-show="u.is_locked" @click="unlockUser(u)"
                                                class="text-xs px-2 py-1 rounded border border-gray-300 text-green-600 hover:bg-green-50 transition"
                                                title="Blokdan çıxar">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>
                                        </button>
                                        <!-- Activate/Deactivate -->
                                        <button x-show="u.is_active" @click="setActive(u, false)" :disabled="u.id === currentUser?.id"
                                                class="text-xs px-2 py-1 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed transition"
                                                title="Deaktiv et">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
                                        </button>
                                        <button x-show="!u.is_active" @click="setActive(u, true)"
                                                class="text-xs px-2 py-1 rounded border border-gray-300 text-green-600 hover:bg-green-50 transition"
                                                title="Aktiv et">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                        </button>
                                        <!-- Reset password -->
                                        <button @click="openResetPassword(u)"
                                                class="text-xs px-2 py-1 rounded border border-gray-300 text-blue-600 hover:bg-blue-50 transition"
                                                title="Şifrə sıfırla">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                                        </button>
                                        <!-- Delete -->
                                        <button @click="deleteUser(u)" :disabled="u.id === currentUser?.id"
                                                class="text-xs px-2 py-1 rounded border border-gray-300 text-red-600 hover:bg-red-50 disabled:opacity-30 disabled:cursor-not-allowed transition"
                                                title="Sil">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Not admin message -->
    <div x-show="!authChecking && currentUser?.role !== 'admin'" x-cloak class="max-w-md mx-auto mt-20 text-center">
        <div class="bg-red-50 border border-red-200 rounded-xl p-8">
            <svg class="w-12 h-12 text-red-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <h2 class="text-lg font-bold text-red-800 mb-1">Giriş qadağandır</h2>
            <p class="text-sm text-red-600 mb-4">Bu səhifəyə yalnız admin istifadəçilər daxil ola bilər.</p>
            <a href="/dashboard" class="inline-block text-teal-600 hover:text-teal-800 text-sm font-medium">← Siyahıya qayıt</a>
        </div>
    </div>

    <!-- Create User Modal -->
    <div x-show="showCreateModal" x-transition x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" @click.self="showCreateModal = false">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Yeni istifadəçi yarat</h2>
            <div x-show="createError" class="mb-3 p-2 rounded bg-red-50 border border-red-200 text-red-600 text-sm" x-text="createError"></div>
            <div class="space-y-3">
                <div>
                    <label class="text-sm text-gray-600 mb-1 block">İstifadəçi adı</label>
                    <input type="text" x-model="createForm.username" class="input-field w-full px-3 py-2 rounded-lg" placeholder="məs: eli2010">
                </div>
                <div>
                    <label class="text-sm text-gray-600 mb-1 block">Şifrə</label>
                    <input type="password" x-model="createForm.password" class="input-field w-full px-3 py-2 rounded-lg" placeholder="ən az 6 simvol">
                </div>
                <div>
                    <label class="text-sm text-gray-600 mb-1 block">Rol</label>
                    <select x-model="createForm.role" class="input-field w-full px-3 py-2 rounded-lg">
                        <option value="expert">Ekspert</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 mt-5">
                <button @click="showCreateModal = false" class="flex-1 px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition">İmtina</button>
                <button @click="createUser()" :disabled="creating"
                        class="flex-1 alpul-btn text-white px-4 py-2 rounded-lg font-medium transition disabled:opacity-50">
                    <span x-show="!creating">Yarat</span>
                    <span x-show="creating">Yaradılır...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div x-show="showResetModal" x-transition x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" @click.self="showResetModal = false">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-1">Şifrə sıfırla</h2>
            <p class="text-sm text-gray-500 mb-4">İstifadəçi: <strong x-text="resetTarget?.username"></strong></p>
            <div x-show="resetError" class="mb-3 p-2 rounded bg-red-50 border border-red-200 text-red-600 text-sm" x-text="resetError"></div>
            <div>
                <label class="text-sm text-gray-600 mb-1 block">Yeni şifrə</label>
                <input type="password" x-model="resetForm.new_password" class="input-field w-full px-3 py-2 rounded-lg" placeholder="ən az 6 simvol">
            </div>
            <div class="flex gap-2 mt-5">
                <button @click="showResetModal = false" class="flex-1 px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition">İmtina</button>
                <button @click="resetPassword()" :disabled="resetting"
                        class="flex-1 alpul-btn text-white px-4 py-2 rounded-lg font-medium transition disabled:opacity-50">
                    <span x-show="!resetting">Sıfırla</span>
                    <span x-show="resetting">Sıfırlanır...</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function adminPanel() {
            return {
                users: [],
                loading: false,
                error: '',
                success: '',
                authChecking: true,
                currentUser: null,
                theme: localStorage.getItem('alpul_theme') || 'light',

                // Create modal
                showCreateModal: false,
                createForm: { username: '', password: '', role: 'expert' },
                creating: false,
                createError: '',

                // Reset password modal
                showResetModal: false,
                resetTarget: null,
                resetForm: { new_password: '' },
                resetting: false,
                resetError: '',

                async init() {
                    this.initTheme();
                    await this.checkAuth();
                    if (this.currentUser?.role === 'admin') {
                        this.load();
                    }
                },

                initTheme() { document.body.setAttribute('data-theme', this.theme); },
                toggleTheme() {
                    this.theme = this.theme === 'light' ? 'dark' : 'light';
                    document.body.setAttribute('data-theme', this.theme);
                    localStorage.setItem('alpul_theme', this.theme);
                },

                async checkAuth() {
                    try {
                        const resp = await fetch('/api/auth/me');
                        if (resp.status === 401) {
                        window.clearAuthToken();
                            window.location.href = '/login?redirect=/admin';
                            return;
                        }
                        if (!resp.ok) throw new Error('Auth failed');
                        this.currentUser = await resp.json();
                    } catch (e) {
                        window.location.href = '/login?redirect=/admin';
                        return;
                    } finally {
                        this.authChecking = false;
                    }
                },

                async logout() {
                    try { await fetch('/api/auth/logout', { method: 'POST' });
                    window.clearAuthToken(); } catch (e) {}
                    window.location.href = '/login';
                },

                async load() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const resp = await fetch('/api/admin/users');
                        if (!resp.ok) throw new Error('Siyahı yüklənə bilmədi');
                        this.users = await resp.json();
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                showMsg(msg) {
                    this.success = msg;
                    setTimeout(() => { this.success = ''; }, 3000);
                },

                async createUser() {
                    this.creating = true;
                    this.createError = '';
                    try {
                        const resp = await fetch('/api/admin/users', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(this.createForm),
                        });
                        const data = await resp.json();
                        if (!resp.ok) { this.createError = data.error || 'Xəta'; return; }
                        this.showCreateModal = false;
                        this.createForm = { username: '', password: '', role: 'expert' };
                        this.showMsg('İstifadəçi yaradıldı');
                        this.load();
                    } catch (e) {
                        this.createError = 'Bağlantı xətası';
                    } finally {
                        this.creating = false;
                    }
                },

                async toggleRole(u) {
                    const newRole = u.role === 'admin' ? 'expert' : 'admin';
                    if (!confirm(`${u.username} rolunu ${newRole === 'admin' ? 'Admin' : 'Ekspert'}-ə dəyiş?`)) return;
                    try {
                        const resp = await fetch(`/api/admin/users/${u.id}/role`, {
                            method: 'PUT', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ role: newRole }),
                        });
                        if (!resp.ok) { const d = await resp.json(); this.error = d.error; return; }
                        this.showMsg('Rol dəyişdirildi');
                        this.load();
                    } catch (e) { this.error = 'Xəta'; }
                },

                async lockUser(u) {
                    if (!confirm(`${u.username} bloklansın?`)) return;
                    try {
                        const resp = await fetch(`/api/admin/users/${u.id}/lock`, { method: 'PUT' });
                        if (!resp.ok) { const d = await resp.json(); this.error = d.error; return; }
                        this.showMsg('İstifadəçi bloklandı');
                        this.load();
                    } catch (e) { this.error = 'Xəta'; }
                },

                async unlockUser(u) {
                    try {
                        const resp = await fetch(`/api/admin/users/${u.id}/unlock`, { method: 'PUT' });
                        if (!resp.ok) { const d = await resp.json(); this.error = d.error; return; }
                        this.showMsg('Blokdan çıxarıldı');
                        this.load();
                    } catch (e) { this.error = 'Xəta'; }
                },

                async setActive(u, active) {
                    try {
                        const resp = await fetch(`/api/admin/users/${u.id}/active`, {
                            method: 'PUT', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ active }),
                        });
                        if (!resp.ok) { const d = await resp.json(); this.error = d.error; return; }
                        this.showMsg(active ? 'Aktivləşdirildi' : 'Deaktiv edildi');
                        this.load();
                    } catch (e) { this.error = 'Xəta'; }
                },

                openResetPassword(u) {
                    this.resetTarget = u;
                    this.resetForm = { new_password: '' };
                    this.resetError = '';
                    this.showResetModal = true;
                },

                async resetPassword() {
                    this.resetting = true;
                    this.resetError = '';
                    try {
                        const resp = await fetch(`/api/admin/users/${this.resetTarget.id}/password`, {
                            method: 'PUT', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(this.resetForm),
                        });
                        const data = await resp.json();
                        if (!resp.ok) { this.resetError = data.error || 'Xəta'; return; }
                        this.showResetModal = false;
                        this.showMsg('Şifrə sıfırlandı');
                    } catch (e) {
                        this.resetError = 'Bağlantı xətası';
                    } finally {
                        this.resetting = false;
                    }
                },

                async deleteUser(u) {
                    if (!confirm(`${u.username} silinsin? Bu əməliyyat geri alına bilməz!`)) return;
                    try {
                        const resp = await fetch(`/api/admin/users/${u.id}`, { method: 'DELETE' });
                        if (!resp.ok) { const d = await resp.json(); this.error = d.error; return; }
                        this.showMsg('İstifadəçi silindi');
                        this.load();
                    } catch (e) { this.error = 'Xəta'; }
                },
            };
        }
    </script>
</body>
</html>
