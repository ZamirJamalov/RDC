<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDC — Muraciet Detali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/auth.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        /* PR #176: AZMK fonts — Geist for headings/numbers, Geist Mono for calculator */
        h1, h2, h3, h4, h5, h6,
        .font-extrabold, .font-black,
        .gradient-text, .gradient-accent-text,
        .calc-num, .num-shift,
        .alpul-grad-text {
            font-family: 'Geist', 'IBM Plex Sans', sans-serif;
        }
        .font-mono, .tabular-nums, input[type="number"], input[inputmode="decimal"], input[inputmode="numeric"] {
            font-family: 'Geist Mono', 'IBM Plex Sans', monospace;
            font-variant-numeric: tabular-nums;
        }

        /* PR #238: Alpine init-dən əvvəl gizlət (modal/overlay FOUC qarşısı) */
        [x-cloak] { display: none !important; }

        /* Brand */
        .alpul-btn { background: linear-gradient(135deg, #2D9CDB 0%, #1d5a8f 100%); }
        .alpul-btn:hover { box-shadow: 0 4px 14px rgba(45, 156, 219, 0.45); }
        .alpul-grad-text {
            background: linear-gradient(135deg, #2D9CDB 0%, #F2C94C 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Theme variables (synced with index.html) */
        [data-theme="light"] {
            --bg: #F0F4F8; --card: #FFFFFF; --text: #1E293B; --text-soft: #64748B; --border: #E2E8F0;
        }
        /* PR #509: dark theme silindi — RDC həmişə light. Aşağıdakı
           [data-theme="dark"] override-ları mərkəzləşdirilmiş şəkildə silinib. */

        /* Sticky compact header */
        .top-header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        /* Panel */
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.04);
            transition: box-shadow .2s, border-color .2s;
        }
        .panel:hover { box-shadow: 0 4px 16px rgba(15,23,42,0.06); }

        /* PR #408: müştəri şəkli — tema sərhədi (light/dark) */
        .customer-photo {
            border: 1px solid var(--border);
            object-fit: cover;
        }

        .panel-title { color: var(--text); }
        .panel-divider { border-color: var(--border); }
        .label-soft { color: var(--text-soft); }
        .value-strong { color: var(--text); }

        .field-input {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            color: #1E293B;
            transition: border-color .15s, box-shadow .15s;
            width: 100%;
        }
        .field-input:focus {
            outline: none;
            border-color: #2D9CDB;
            box-shadow: 0 0 0 3px rgba(45, 156, 219,0.15);
        }

        .sub-card {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 11px; /* PR #402: 12px → 9px — kompakt layout */
        }
        .sub-card-title { color: #64748B; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }

        /* Status badges */
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }

        /* Icon chip in section header */
        .icon-chip {
            width: 28px; height: 28px; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 14px;
            background: linear-gradient(135deg, rgba(45, 156, 219,0.12), rgba(242, 201, 76,0.12));
            color: #2D9CDB;
        }

        /* Make body scrollable on all sizes (3-row layout may overflow) */
        @media (min-width: 1024px) {
            html, body { height: auto; overflow: auto; }
        }

        /* ===== PR #443: yeni 3-sütunlu dizayn (approved eskiz) ===== */
        body { background: linear-gradient(180deg, #F5F9FC 0%, #EDF2F7 100%); }

        /* PR #448: max-width 1400px silindi — 3 sütun və toolbar tam enə genişlənir
           (kənarlarda boş yer qalmır) */
        .detail-wrap { width: 100%; }

        /* Kart başlığı — ikon + 18px başlıq + 2px alt xətt */
        .card-head { display: flex; align-items: center; gap: 8px; padding-bottom: 12px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
        .card-head h2 { font-size: 18px; font-weight: 700; color: var(--text); }

        /* PR #465/#468: bölmələr ALT-ALTA — daha yuxarı, sıx */
        .detail-grid { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; margin-top: 12px; }

        /* Header müştəri avatarı (40px dairə) */
        .cust-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, rgba(45,156,219,.15), rgba(242,201,76,.15));
            display: flex; align-items: center; justify-content: center; font-size: 17px; }
        /* PR #465: header avatarı real şəkildirsə */
        img.cust-avatar { object-fit: cover; border: 2px solid var(--border); cursor: zoom-in; }

        /* PR #465: toolbar qrup qutuları — hər növ öz rəng tonunda ayrılır */
        .tb-group { border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; }
        .tb-video      { background: rgba(128, 90, 213, 0.07); border-color: rgba(128, 90, 213, 0.35); }
        .tb-compliance { background: rgba(20, 184, 166, 0.07); border-color: rgba(20, 184, 166, 0.35); }
        .tb-mygov      { background: rgba(99, 102, 241, 0.07); border-color: rgba(99, 102, 241, 0.35); }
        .tb-decision   { background: rgba(245, 158, 11, 0.07); border-color: rgba(245, 158, 11, 0.35); }

        /* PR #467: üzən draggable şəkil paneli (modal deyil — bağlanma yalnız ✕ ilə) */
        .photo-float { position: fixed; z-index: 70; width: 320px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); }
        .photo-float-handle { cursor: move; user-select: none; }

        /* ============ PR #472: KLASSİK table-lar — th/td, colgroup ============ */
        /* Wrapper: border + radius + üfüqi scroll (dar ekranda) */
        .tbl-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; overflow-x: auto; }
        /* table-layout:auto — sütun eni = max(col width, məzmun) → üst-üstə düşmə
           mümkünsüz; width:100% qalan eni sütunlara paylayır (klassik davranış) */
        .apl-table { width: 100%; border-collapse: collapse; table-layout: auto; }
        .apl-table th {
            position: relative; padding: 7px 8px; padding-right: 16px;
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.04em; color: var(--text-soft); white-space: nowrap;
            text-align: left; background: #F1F5F9; border-bottom: 2px solid var(--border);
        }
        .apl-table td { padding: 3px 6px; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); vertical-align: middle; }
        .apl-table td:first-child, .apl-table th:first-child { border-left: none; }
        .apl-table tbody tr:last-child td { border-bottom: none; }
        /* zebra + hover — nth-child (PR #472: ct-zebra sinifsiz) */
        .apl-table tbody tr:nth-child(even) { background: rgba(100, 116, 139, 0.05); }
        .apl-table tbody tr:hover { background: rgba(45, 156, 219, 0.06); }
        /* PR #468/#469: sütun resize tutacağı — th sağ kənarında */
        .th-rs { position: absolute; right: 0; top: 0; bottom: 0; width: 9px; cursor: col-resize; user-select: none; z-index: 2; }
        .th-rs::after { content: ''; position: absolute; right: 3px; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--border); }
        .apl-table th:hover .th-rs::after, .th-rs:hover::after { background: #2D9CDB; }
        /* hücrə-dolduran inputlar — APEX üslubu (PR #467: textarea da daxil) */
        .apl-table .field-input {
            border-color: transparent; background: transparent; border-radius: 0;
        }
        .apl-table .field-input:not(.bg-rose-50):not(:disabled):hover { border-color: var(--border); }
        .apl-table .field-input:focus { border-color: #2D9CDB; background: #FFFFFF; }
        .apl-table .field-input.bg-rose-50 { background: #FFF1F2; border-color: #FDA4AF; }

        /* PR #447: video-banner CSS silindi — toolbar banner-i əvəz etdi */

        /* Kredit stat qutuları — rəngli fonlar */
        .stat-box { border-radius: 8px; padding: 12px; text-align: center; }
        .stat-box .lbl { font-size: 12px; color: var(--text-soft); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
        .stat-box .val { font-size: 28px; font-weight: 800; line-height: 1.1; }
        .stat-amount { background: #E6FFFA; } .stat-amount .val { color: #38B2AC; }
        .stat-term   { background: #F0FFF4; } .stat-term   .val { color: #48BB78; }
        .stat-comm   { background: #F0FFF4; } .stat-comm   .val { color: #68D391; }

        /* İllik faiz — qırmızı vurğu */
        .rate-red { color: #E53E3E; }

        /* Müştəri şəkli — mərkəzdə 120px */
        .photo-center { width: 120px; height: 120px; border: 3px solid var(--border); border-radius: 8px; object-fit: cover; margin: 16px auto; display: block; }

        /* Əlaqə bloku — kənarlı qutu */
        .contact-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px; }

        /* İmtina düyməsi — açıq qırmızı (spec) */
        .btn-reject { background: #FEB2B2; color: #C53030; border: 2px solid #F56565; }
        .btn-reject:hover { background: #FC8181; }

        /* Xəbərdarlıq qutuları — sol ştrixli */
        .note-warn { padding: 10px 12px; border-radius: 6px; font-size: 12px; border-left: 4px solid; }
        .note-yellow { background: #FEF3C7; color: #B7791F; border-left-color: #F6E05E; }
        .note-red    { background: #FFF5F5; color: #C53030; border-left-color: #FC8181; }
    </style>
</head>
<body class="min-h-screen" data-theme="light" x-data="appDetail()" x-init="init()" x-cloak>
    <div class="min-h-screen flex flex-col">

        <!-- PR #142: Auth check loading screen -->
        <div x-show="authChecking" class="fixed inset-0 flex items-center justify-center bg-gray-50 z-50">
            <div class="text-gray-500">Yoxlanılır...</div>
        </div>

        <!-- PR #238: EMPLOYMENT_TENURE imtina dialoqu -->
        <div x-show="empRejectModalOpen" x-cloak class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4" @keydown.escape.window="closeEmpRejectModal()">
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl max-w-md w-full p-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center shrink-0">
                        <svg class="w-6 h-6 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-900 dark:text-gray-100">Müraciət imtina edildi</h3>
                        <p class="text-xs text-gray-500">İş yeri yoxlaması (EMPLOYMENT_TENURE) uğursuz oldu</p>
                    </div>
                </div>
                <div class="bg-rose-50 border border-rose-100 rounded-lg p-3 mb-5">
                    <div class="text-[11px] uppercase tracking-wide text-rose-500 font-semibold mb-1">İmtina səbəbi</div>
                    <div class="text-sm text-gray-800 dark:text-gray-200" x-text="empRejectModalReason"></div>
                </div>
                <p class="text-xs text-gray-400 mb-5">Dialoqu bağladıqdan sonra müraciət imtina səbəbi ilə sonlandırılır və dashboard-da «İmtina» statusu ilə görünür.</p>
                <button @click="closeEmpRejectModal()" class="w-full bg-rose-600 text-white px-4 py-2.5 rounded-lg hover:bg-rose-700 font-semibold text-sm transition">Bağla və yenilə</button>
            </div>
        </div>

        <!-- PR #399: Videya bax dialoqu — stream URL-dən video oynadılır -->
        <!-- PR #428: dialoq başlıqdan tutub sürüşdürülə bilər (drag) -->
        <div x-show="videoDialogOpen" x-cloak class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4" @keydown.escape.window="closeVideoDialog()" @mousemove.window="onVideoDrag($event)" @mouseup.window="endVideoDrag()" @mouseleave.window="endVideoDrag()">
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl max-w-2xl w-full p-4 select-none" :style="'transform: translate(' + videoDragX + 'px, ' + videoDragY + 'px)'">
                <div class="flex items-center justify-between mb-3 cursor-move" @mousedown.prevent="startVideoDrag($event)">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">🎥</span>
                        <h3 class="font-bold text-gray-900 dark:text-gray-100">Video Verifikasiya</h3>
                    </div>
                    <div class="flex items-center gap-2">
                        <span x-show="!videoDragging" class="text-[10px] text-gray-400 hidden sm:inline">⇕ sürüşdür</span>
                        <button @mousedown.stop @click="closeVideoDialog()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                </div>
                <div class="bg-black rounded-lg overflow-hidden aspect-video flex items-center justify-center">
                    <!-- PR #405: ✓ yalnız video REAL yüklənəndə (ilk kadr oxunanda) -->
                    <video id="videoVerifyPlayer" x-show="videoStreamUrl" :src="videoStreamUrl" controls playsinline @loadeddata="videoWatched = true" class="w-full h-full"></video>
                    <div x-show="!videoStreamUrl && !videoStreamError" class="text-gray-400 text-sm animate-pulse">Yüklənir...</div>
                    <!-- PR #440: xəta/gözləmə mesajı — görünən blok (ikon + rəng):
                         amber = yeni video gözlənilir, rose = digər xətalar -->
                    <div x-show="videoStreamError" class="px-6 py-8 text-center">
                        <div class="text-3xl mb-2" x-text="videoPendingNew ? '⏳' : '⚠️'"></div>
                        <div class="text-sm font-semibold px-2"
                             :class="videoPendingNew ? 'text-amber-400' : 'text-rose-400'"
                             x-text="videoStreamError"></div>
                    </div>
                </div>
                <p x-show="videoStreamUrl" class="text-[10px] text-gray-400 mt-2 break-all" x-text="videoStreamUrl"></p>
            </div>
        </div>

        <!-- PR #408/#467: Müştəri şəkli — ÜZƏN DRAGGABLE panel (modal deyil:
             backdrop yoxdur, digər düymələr klik olanda bağlanmır, yalnız ✕ və ya Esc) -->
        <div x-show="photoDialogOpen" x-cloak
             class="photo-float bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700"
             :style="`left:${photoPos.x}px; top:${photoPos.y}px;`"
             @keydown.escape.window="photoDialogOpen = false"
             @mousemove.window="onPhotoDrag($event)"
             @mouseup.window="photoDrag.active = false"
             @touchmove.window.prevent="onPhotoDrag($event.touches[0])"
             @touchend.window="photoDrag.active = false">
            <div class="photo-float-handle flex items-center justify-between px-4 py-2.5 border-b border-gray-200 dark:border-gray-700"
                 @mousedown.prevent="startPhotoDrag($event)"
                 @touchstart.prevent="startPhotoDrag($event.touches[0])">
                <div class="flex items-center gap-2 min-w-0">
                    <span class="text-xl shrink-0">👤</span>
                    <h3 class="font-bold text-gray-900 dark:text-gray-100 truncate" x-text="app?.customer_full_name || 'Müştəri şəkli'"></h3>
                </div>
                <button @click="photoDialogOpen = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition shrink-0" title="Bağla (Esc)">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-3">
                <img :src="customerPhoto" alt="Müştəri şəkli (tam ölçü)"
                     class="max-h-[70vh] w-full rounded-lg object-contain select-none" draggable="false">
            </div>
        </div>

        <template x-if="!authChecking">
        <div id="pageShell" class="min-h-screen flex flex-col">

        <!-- ============ TOP HEADER (sticky, compact) ============ -->
        <header class="top-header sticky top-0 z-30 px-5 py-3 flex items-center gap-4">
            <a href="/dashboard" class="flex items-center gap-2 text-teal-600 hover:text-teal-800 transition text-sm font-medium">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                <span class="hidden sm:inline">Siyahı</span>
            </a>
            <div class="h-6 w-px bg-gray-300"></div>
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <!-- PR #465: 40px müştəri avatarı — real şəkil (klik → tam ölçü), yoxdursa 👤 siluet -->
                <template x-if="customerPhoto">
                    <img :src="customerPhoto" alt="Müştəri şəkli" title="Şəkilə klik — üzən panel"
                         @click="openPhoto()" class="cust-avatar">
                </template>
                <div x-show="!customerPhoto" class="cust-avatar" title="Müştəri">👤</div>
                <div class="min-w-0">
                    <h1 class="text-base font-bold text-gray-800 truncate flex items-center gap-2" :class="{'panel-title': true}">
                        <span x-text="app?.customer_full_name || 'Müraciət'"></span>
                    </h1>
                    <!-- PR #468/#469: PIN | Seriya | Telefon 0-formatda — dəyərin ÖZÜNƏ kliklə copy -->
                    <div class="flex flex-wrap items-center gap-x-2.5 gap-y-0.5 text-xs hidden sm:flex" x-show="app">
                        <span class="inline-flex items-center gap-1 cursor-pointer hover:text-teal-600 transition"
                              title="PIN — kopyalamaq üçün klikləyin"
                              @click="copyToClipboard(app?.customer_pin)"
                              x-text="app?.customer_pin || '-'"></span>
                        <span class="text-gray-300 dark:text-gray-600">·</span>
                        <span class="font-semibold text-gray-600 dark:text-gray-300" title="Seriya"
                              x-text="app?.customer_serial || '-'"></span>
                        <span class="text-gray-300 dark:text-gray-600">·</span>
                        <span class="inline-flex items-center gap-1 font-mono font-semibold text-gray-600 dark:text-gray-300 cursor-pointer hover:text-teal-600 transition"
                              title="Nömrəni kopyala (0-formatda)"
                              @click="copyPhoneLocal(app?.customer_phone)"
                              x-text="phoneLocal(app?.customer_phone)"></span>
                    </div>
                    <p class="text-xs text-gray-500 sm:hidden" x-text="app?.customer_pin || ''"></p>
                </div>
            </div>

            <!-- Status badge -->
            <span x-show="app" class="badge shrink-0"
                  :class="{
                      'bg-amber-100 text-amber-800': app?.status === 'pending_approval',
                      'bg-emerald-100 text-emerald-800': app?.status === 'approved',
                      'bg-rose-100 text-rose-800': app?.status === 'rejected',
                      'bg-teal-100 text-teal-800': app?.status === 'pending' || app?.status === 'checking' || app?.status === 'pending_expert' || app?.status === 'pending_customer',
                      'bg-indigo-100 text-indigo-800': app?.status === 'pending_signature',
                      'bg-blue-100 text-blue-800': app?.status === 'disbursed',
                      'bg-orange-100 text-orange-800': app?.status === 'disbursing',
                      'bg-rose-100 text-rose-700': app?.status === 'disburse_failed',
                      'bg-gray-200 text-gray-700': app?.status === 'cancelled'
                  }"
                  x-text="app?.status || ''">
            </span>

            <!-- PR #134: Timer -->
            <div x-show="app && (app.status === 'pending_approval' || app.status === 'pending_expert')"
                 class="flex items-center gap-1.5 shrink-0 bg-gray-900 text-teal-400 px-3 py-1.5 rounded-lg font-mono text-sm font-bold tabular-nums">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><polyline points="12 6 12 12 16 14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span x-text="timerDisplay"></span>
            </div>

            <!-- PR #142: User info (compact) -->
            <div class="hidden md:flex items-center gap-2 shrink-0">
                <div class="w-8 h-8 rounded-full bg-teal-500/20 border border-teal-500/30 flex items-center justify-center font-bold text-teal-600 text-xs"
                     x-text="currentUser ? currentUser.username.charAt(0).toUpperCase() : '?'"></div>
                <span class="text-sm font-medium text-gray-600" x-text="currentUser?.username"></span>
            </div>

            <!-- PR #467: Dəyişiklik tarixçəsi (audit) — zəng ikonu + popover -->
            <div class="relative shrink-0">
                <button @click="auditOpen = !auditOpen"
                        class="w-9 h-9 rounded-lg border border-gray-300 flex items-center justify-center hover:bg-gray-100 transition relative"
                        title="Dəyişiklik tarixçəsi">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                    <span x-show="auditEntries.length" class="absolute top-1 right-1 w-2 h-2 rounded-full bg-red-500"></span>
                </button>
                <div x-show="auditOpen" x-cloak @click.outside="auditOpen = false"
                     class="absolute right-0 top-11 z-50 w-80 bg-white dark:bg-gray-800 rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 p-3">
                    <div class="flex items-center justify-between mb-2 pb-2 border-b border-gray-100 dark:border-gray-700">
                        <span class="font-bold text-sm text-gray-900 dark:text-gray-100">Dəyişiklik tarixçəsi</span>
                        <span class="text-[10px] text-gray-400" x-text="auditEntries.length + ' qeyd'"></span>
                    </div>
                    <div x-show="!auditEntries.length" class="text-xs text-gray-400 py-3 text-center">Dəyişiklik qeydi yoxdur</div>
                    <ul class="space-y-1.5 max-h-72 overflow-y-auto list-none p-0 m-0">
                        <template x-for="(e, i) in auditEntries" :key="i">
                            <li class="flex items-start justify-between gap-2 border-b border-gray-50 dark:border-gray-700/50 last:border-0 pb-1.5">
                                <div class="min-w-0">
                                    <span class="font-medium text-xs text-gray-900 dark:text-gray-100" x-text="e.label"></span>
                                    <div class="text-[11px] text-gray-400 truncate" x-text="e.user"></div>
                                </div>
                                <span class="text-[10px] text-gray-400 whitespace-nowrap shrink-0 mt-0.5"
                                      x-text="e.at ? new Date(e.at).toLocaleString('az') : '—'"></span>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>

            <!-- PR #509: theme toggle silindi — RDC həmişə light -->

            <button @click="load()" class="hidden sm:inline-flex alpul-btn text-white px-3 py-2 rounded-lg text-sm font-medium transition shrink-0 items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Yenile
            </button>

            <!-- PR #142: Logout button -->
            <button @click="logout()" class="w-9 h-9 rounded-lg border border-gray-300 flex items-center justify-center hover:bg-red-50 hover:border-red-300 hover:text-red-600 transition shrink-0" title="Çıxış">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            </button>
        </header>

        <!-- ============ MAIN GRID ============ -->
        <main class="flex-1 px-5 py-3 overflow-auto">

            <!-- Loading -->
            <div x-show="loading" class="flex items-center justify-center h-full text-gray-500">
                <div class="flex items-center gap-2">
                    <svg class="animate-spin w-5 h-5 text-teal-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                    Yuklenir...
                </div>
            </div>

            <!-- Error -->
            <div x-show="error" class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-lg mb-4 text-sm" x-text="error"></div>

            <!-- Content -->
            <!-- PR #443: 3-sütunlu dizayn — eskiz təsdiqlənib:
                 SOL: Müştəri | ORTA: Kredit + MyGov + Komplayans | SAĞ: Əlaqə + Qərar -->
            <div x-show="!loading && !error && app" class="detail-wrap">

                <!-- PR #447: TOOLBAR — bütün əməliyyat düymələri bir yerdə
                     (video banner, MyGov, Komplayns, Qərar bölmələrini əvəz edir) -->
                <section class="panel p-3 mt-2 flex flex-col gap-2">
                    <div class="flex flex-nowrap items-end gap-x-3 overflow-x-auto">

                        <!-- ===== VIDEO qrupu (PR #465: bənövşəyi ton) ===== -->
                        <div class="tb-group tb-video flex flex-col gap-1">
                            <span class="text-[10px] uppercase tracking-wide text-gray-400 font-semibold">🎥 Video</span>
                            <div class="flex gap-1.5">
                                <button @click="openVideoDialog()"
                                        :disabled="videoStreamLoading"
                                        class="text-white px-2 py-1.5 rounded-md text-xs font-medium disabled:opacity-50 transition"
                                        style="background:#805AD5">
                                    <span x-show="!videoStreamLoading"><span x-show="videoWatched" class="text-emerald-300 mr-1 font-bold">✓</span>▶ Videoya bax</span>
                                    <span x-show="videoStreamLoading">Açılır...</span>
                                </button>
                                <!-- PR #437: yalnız pending_expert statusunda aktiv -->
                                <button @click="videoRequest()"
                                        :disabled="videoLoading || app?.status !== 'pending_expert'"
                                        :title="app?.status !== 'pending_expert' ? 'Video müraciət yalnız «Ekspert gözləyir» statusunda göndərilə bilər' : 'SMS ilə video çəkilmə linki göndər'"
                                        class="text-white px-2 py-1.5 rounded-md text-xs font-medium disabled:opacity-50 transition"
                                        style="background:#38B2AC">
                                    <span x-show="!videoLoading"><span x-show="videoOrderSent" class="text-emerald-300 mr-1 font-bold">✓</span>📤 Video istə</span>
                                    <span x-show="videoLoading">Göndərilir...</span>
                                </button>
                            </div>
                        </div>

                        <!-- PR #447/A2: ===== KOMPLAYNS qrupu (PR #465: teal ton) ===== -->
                        <div class="tb-group tb-compliance flex flex-col gap-1" x-show="app?.status === 'pending_approval' || app?.status === 'pending_expert'">
                            <span class="text-[10px] uppercase tracking-wide text-gray-400 font-semibold">🔍 Komplayns</span>
                            <div class="flex gap-1.5">
                                <button @click="complianceChecked = true; copyToClipboard(app?.customer_full_name); markDone('compliance_name')"
                                        :title="app?.customer_full_name || ''"
                                        class="sub-card !py-1.5 px-2 rounded-md text-xs font-medium hover:border-teal-300 transition inline-flex items-center gap-1.5">
                                    📋 Adı kopyala
                                    <span x-show="compliance.name" class="text-emerald-500 font-bold">✓</span>
                                </button>
                                <a href="https://hms.gov.az/" target="_blank" rel="noopener noreferrer"
                                   @click="markDone('compliance_hms')"
                                   class="sub-card !py-1.5 px-2 rounded-md text-xs font-medium hover:border-teal-300 transition inline-flex items-center gap-1.5 no-underline">
                                    HMS
                                    <span x-show="compliance.hms" class="text-emerald-500 font-bold">✓</span>
                                </a>
                                <a href="https://www.opensanctions.org/" target="_blank" rel="noopener noreferrer"
                                   @click="markDone('compliance_os')"
                                   class="sub-card !py-1.5 px-2 rounded-md text-xs font-medium hover:border-teal-300 transition inline-flex items-center gap-1.5 no-underline">
                                    OpenSanctions
                                    <span x-show="compliance.os" class="text-emerald-500 font-bold">✓</span>
                                </a>
                            </div>
                        </div>
                        <!-- PR #447/A3: ===== MYGOV qrupu (PR #465: indigo ton) ===== -->
                        <div class="tb-group tb-mygov flex flex-col gap-1" x-show="app?.status === 'pending_approval' || app?.status === 'pending_expert'">
                            <span class="text-[10px] uppercase tracking-wide text-gray-400 font-semibold">🏛️ MyGov</span>
                            <div class="flex flex-wrap gap-1.5 items-center">
                                <!-- İş yeri: Sorgu + Yoxla (PR #415 cooldown, 'passed' olanda deaktiv) -->
                                <div class="flex gap-1.5 items-center">
                                    <span class="text-[10px] text-gray-400 font-medium">İş yeri:</span>
                                    <button @click="employmentRequest()"
                                            :disabled="employmentLoading || employmentResult === 'passed' || mygovCooldown.empReq > 0"
                                            class="alpul-btn text-white px-2 py-1.5 rounded-md text-xs font-medium disabled:opacity-50 transition">
                                        <span x-show="!employmentLoading && mygovCooldown.empReq <= 0"><span x-show="employmentSMSDone" class="text-emerald-300 mr-0.5 font-bold">✓</span>📤 Sorgu</span>
                                        <span x-show="employmentLoading">...</span>
                                        <span x-show="!employmentLoading && mygovCooldown.empReq > 0" x-text="'⏳ ' + mygovCooldown.empReq + ' san'"></span>
                                    </button>
                                    <button @click="employmentVerify()"
                                            :disabled="employmentVerifying || employmentResult === 'passed' || mygovCooldown.empVerify > 0"
                                            class="bg-indigo-600 text-white px-2 py-1.5 rounded-md text-xs font-medium hover:bg-indigo-700 disabled:opacity-50 transition">
                                        <span x-show="!employmentVerifying && mygovCooldown.empVerify <= 0"><span x-show="employmentVerified" class="text-emerald-300 mr-0.5 font-bold">✓</span>Yoxla</span>
                                        <span x-show="employmentVerifying">...</span>
                                        <span x-show="!employmentVerifying && mygovCooldown.empVerify > 0" x-text="'⏳ ' + mygovCooldown.empVerify + ' san'"></span>
                                    </button>
                                    <span x-show="employmentResult" class="badge text-[10px] px-2 py-0.5"
                                          :class="{'bg-emerald-100 text-emerald-700': employmentResult === 'passed', 'bg-rose-100 text-rose-700': employmentResult === 'rejected'}"
                                          x-text="employmentResult === 'passed' ? '✓ Keçdi' : '✗ İmtina'"></span>
                                </div>

                                <!-- Pensiya: Sorgu + Yoxla (eyni cooldown məntiqi) -->
                                <div class="flex gap-1.5 items-center">
                                    <span class="text-[10px] text-gray-400 font-medium">Pensiya:</span>
                                    <button @click="pensionRequest()"
                                            :disabled="pensionLoading || pensionResult === 'passed' || mygovCooldown.penReq > 0"
                                            class="alpul-btn text-white px-2 py-1.5 rounded-md text-xs font-medium disabled:opacity-50 transition">
                                        <span x-show="!pensionLoading && mygovCooldown.penReq <= 0"><span x-show="pensionSMSDone" class="text-emerald-300 mr-0.5 font-bold">✓</span>📤 Sorgu</span>
                                        <span x-show="pensionLoading">...</span>
                                        <span x-show="!pensionLoading && mygovCooldown.penReq > 0" x-text="'⏳ ' + mygovCooldown.penReq + ' san'"></span>
                                    </button>
                                    <button @click="pensionVerify()"
                                            :disabled="pensionVerifying || pensionResult === 'passed' || mygovCooldown.penVerify > 0"
                                            class="bg-indigo-600 text-white px-2 py-1.5 rounded-md text-xs font-medium hover:bg-indigo-700 disabled:opacity-50 transition">
                                        <span x-show="!pensionVerifying && mygovCooldown.penVerify <= 0"><span x-show="pensionVerified" class="text-emerald-300 mr-0.5 font-bold">✓</span>Yoxla</span>
                                        <span x-show="pensionVerifying">...</span>
                                        <span x-show="!pensionVerifying && mygovCooldown.penVerify > 0" x-text="'⏳ ' + mygovCooldown.penVerify + ' san'"></span>
                                    </button>
                                    <span x-show="pensionResult" class="badge text-[10px] px-2 py-0.5"
                                          :class="{'bg-emerald-100 text-emerald-700': pensionResult === 'passed', 'bg-rose-100 text-rose-700': pensionResult === 'rejected'}"
                                          x-text="pensionResult === 'passed' ? '✓ Keçdi' : '✗ İmtina'"></span>
                                </div>
                            </div>
                        </div>
                        <!-- PR #447/A4: ===== QƏRAR qrupu (PR #465: amber ton) ===== -->
                        <div class="tb-group tb-decision flex flex-col gap-1" x-show="app?.status === 'pending_approval' || app?.status === 'pending_expert' || (app?.status === 'disburse_failed' && currentUser?.role === 'admin')">
                            <span class="text-[10px] uppercase tracking-wide text-gray-400 font-semibold" x-text="app?.status === 'disburse_failed' ? '⚖️ Admin Qərarı' : '⚖️ Qərar'"></span>
                            <div class="flex flex-wrap gap-1.5 items-center">
                                <!-- Təsdiq (PR #441: disburse_failed-də YOX — yalnız imtina mümkündür) -->
                                <button x-show="app?.status !== 'disburse_failed'" @click="approve()"
                                        class="bg-emerald-600 text-white px-2.5 py-1.5 rounded-md text-xs font-semibold hover:bg-emerald-700 disabled:opacity-50 transition inline-flex items-center gap-1.5"
                                        :disabled="actionLoading">
                                    <svg x-show="!actionLoading" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                                    <svg x-show="actionLoading" class="animate-spin w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                                    <span x-text="actionLoading ? 'Əməliyyat...' : 'Təsdiq'"></span>
                                </button>

                                <!-- İmtina səbəbi (PR #441: disburse_failed-də yalnız MANUAL_DISBURSE_FAILED) -->
                                <select x-model="rejectReason" class="field-input !py-1.5 text-xs w-[150px]">
                                    <option value="">Səbəb seçin...</option>
                                    <template x-for="opt in rejectOptions" :key="opt.value">
                                        <option :value="opt.value" x-text="opt.label"></option>
                                    </template>
                                </select>

                                <button @click="reject()"
                                        class="btn-reject px-2.5 py-1.5 rounded-md text-xs font-semibold transition disabled:opacity-50 inline-flex items-center gap-1.5"
                                        :disabled="actionLoading || !rejectReason">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                                    <span x-text="actionLoading ? 'Əməliyyat...' : 'İmtina'"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <!-- PR #447/A4: status zolağı — dinamik mesajlar (yalnız dolu olanda görünür) -->
                    <div class="border-t pt-2 flex flex-col gap-0.5 text-[11px]">
                        <!-- PR #440: yeni video gözlənilir -->
                        <p x-show="videoPendingNew" class="text-amber-600 font-semibold">⏳ Yeni video hələ çəkilməyib — baxış və təsdiq bloklanıb</p>
                        <!-- Video xətası -->
                        <p x-show="videoError && !videoPendingNew" class="text-rose-600" x-text="videoMessage"></p>
                        <!-- MyGov mesajları -->
                        <p x-show="employmentMessage" :class="employmentResult === 'rejected' ? 'text-rose-600' : 'text-gray-500'" x-text="'İş yeri: ' + employmentMessage"></p>
                        <p x-show="pensionMessage" :class="pensionResult === 'rejected' ? 'text-rose-600' : 'text-gray-500'" x-text="'Pensiya: ' + pensionMessage"></p>
                        <!-- Qərar nəticələri -->
                        <p x-show="actionMessage" class="text-emerald-600 font-semibold" x-text="actionMessage"></p>
                        <p x-show="actionError" class="text-rose-600 font-semibold" x-text="actionError"></p>
                        <!-- Auto-reject səbəbi (rejected statusda) -->
                        <p x-show="app?.status === 'rejected' && app?.rejection_reason" class="text-rose-600">⚠ Müraciət avtomatik imtina edildi: <span x-text="app?.rejection_reason"></span></p>
                    </div>
                </section>

                <div class="detail-grid"> <!-- PR #473: alt-alta — Kredit → Müştəri → Nömrələr -->

                <!-- PR #473: Kredit (1-ci grid) — Müştəridən ƏVVƏL -->
                <section class="panel p-6 flex flex-col">
                    <div class="card-head">
                        <span class="icon-chip">💳</span>
                        <h2 class="panel-title">Kredit</h2>
                        <span x-show="app?.credit_level" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-teal-100 text-teal-700" x-text="levelAz(app?.credit_level)"></span>
                    </div>
                    <!-- PR #472: klassik table — tək sətir. PR #510: sütun sırası
                         yenidən qurulub — Məbləğ və Ümumi(komissiya ilə) silindi,
                         İllik faiz-in yanına müddət üzrə Faiz məbləği əlavə olundu,
                         Karta köçürülən Yekun ödəniş-dən dərhal əvvələ keçdi. -->
                    <div class="tbl-wrap" @mousemove.window="onColResize($event)" @mouseup.window="endColResize()">
                        <table class="apl-table">
                            <colgroup>
                                <col :style="'width:' + colWidths.kredit[0] + 'px'">
                                <col :style="'width:' + colWidths.kredit[1] + 'px'">
                                <col :style="'width:' + colWidths.kredit[2] + 'px'">
                                <col :style="'width:' + colWidths.kredit[3] + 'px'">
                                <col :style="'width:' + colWidths.kredit[4] + 'px'">
                                <col :style="'width:' + colWidths.kredit[5] + 'px'">
                                <col :style="'width:' + colWidths.kredit[6] + 'px'">
                                <col :style="'width:' + colWidths.kredit[7] + 'px'">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th>Müddət<span class="th-rs" @mousedown.prevent="startColResize('kredit', 0, $event)"></span></th>
                                    <th>Komissiya<span class="th-rs" @mousedown.prevent="startColResize('kredit', 1, $event)"></span></th>
                                    <th>Komissiya ₼<span class="th-rs" @mousedown.prevent="startColResize('kredit', 2, $event)"></span></th>
                                    <th>İllik faiz<span class="th-rs" @mousedown.prevent="startColResize('kredit', 3, $event)"></span></th>
                                    <!-- PR #510: müddət üzrə ödəniləcək faiz məbləği — İllik faiz-in yanında -->
                                    <th>Faiz məbləği<span class="th-rs" @mousedown.prevent="startColResize('kredit', 4, $event)"></span></th>
                                    <th>Aylıq ödəniş<span class="th-rs" @mousedown.prevent="startColResize('kredit', 5, $event)"></span></th>
                                    <th>Karta köçürülən<span class="th-rs" @mousedown.prevent="startColResize('kredit', 6, $event)"></span></th>
                                    <th>Yekun ödəniş<span class="th-rs" @mousedown.prevent="startColResize('kredit', 7, $event)"></span></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><span class="value-strong font-semibold text-sm whitespace-nowrap" x-text="(app?.term_months ?? '-') + ' ay'"></span></td>
                                    <td><span class="value-strong font-semibold text-sm whitespace-nowrap" x-text="(app?.approved_rate !== undefined && app?.approved_rate !== null) ? app.approved_rate + '%' : '-'"></span></td>
                                    <!-- PR #509: komissiya məbləği = total_amount − amount -->
                                    <td><span class="value-strong font-semibold text-sm whitespace-nowrap" x-text="commissionAmountAz"></span></td>
                                    <!-- PR #348: illik faiz qırmızı -->
                                    <td><span class="value-strong font-semibold text-sm whitespace-nowrap rate-red" x-text="app?.annual_interest_rate ? app.annual_interest_rate + '%' : '-'"></span></td>
                                    <!-- PR #510: faiz məbləği = ceil(A×n) − total_amount -->
                                    <td><span class="value-strong font-semibold text-sm whitespace-nowrap rate-red" x-text="interestAmountAz"></span></td>
                                    <!-- PR #509: anuitet (apply.html ilə eyni formula) -->
                                    <td><span class="value-strong font-semibold text-sm whitespace-nowrap" style="color:#0f766e" x-text="monthlyPaymentAz"></span></td>
                                    <td><span class="value-strong font-semibold text-sm whitespace-nowrap" x-text="(app?.amount ?? '-') + ' AZN'"></span></td>
                                    <td><span class="value-strong font-semibold text-sm whitespace-nowrap" x-text="totalRepaymentAz"></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Müştəri Məlumatları (2-ci grid) — PR #467: Nömrələr kimi APEX-grid,
                     şəkil header-də (PR #465), audit → header zəngi (PR #467) -->
                <section class="panel p-6 flex flex-col">
                    <div class="card-head">
                        <span class="icon-chip">👤</span>
                        <h2 class="panel-title">Müştəri</h2>
                    </div>
                    <!-- PR #472: klassik table — colgroup (resize enləri) + th/td -->
                    <div class="tbl-wrap" @mousemove.window="onColResize($event)" @mouseup.window="endColResize()">
                        <table class="apl-table">
                            <colgroup>
                                <col :style="'width:' + colWidths.cust[0] + 'px'">
                                <col :style="'width:' + colWidths.cust[1] + 'px'">
                                <col :style="'width:' + colWidths.cust[2] + 'px'">
                            </colgroup>
                            <thead>
                                <tr>
                                    <!-- PR #470: Ad Soyad sütunu silindi — ad header-də (h1) var -->
                                    <th>Kart<span class="th-rs" @mousedown.prevent="startColResize('cust', 0, $event)"></span></th>
                                    <th>Qeydiyyat ünvanı<span class="th-rs" @mousedown.prevent="startColResize('cust', 1, $event)"></span></th>
                                    <th>Faktiki ünvan<span class="th-rs" @mousedown.prevent="startColResize('cust', 2, $event)"></span></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><span class="value-strong font-semibold text-sm whitespace-nowrap" x-text="app?.card_number ? '**** ' + app.card_number.slice(-4) : '-'"></span></td>
                                    <!-- PR #468/#469: Qeydiyyat ünvanı — qısaldılmış sütun (min 100 simvol) -->
                                    <td>
                                        <div class="flex justify-between gap-1">
                                            <span class="value-strong text-sm truncate block" :title="app?.registration_address || ''"
                                                  x-text="trunc(app?.registration_address, 100)"></span>
                                            <button x-show="app?.registration_address" @click="copyToClipboard(app?.registration_address)"
                                                    class="text-teal-500 hover:text-teal-700 transition shrink-0" title="Kopyala">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>

                                            </button>
                                        </div>
                                    </td>

                                    <td>

                                            <div class="flex items-center justify-between gap-1 w-full min-w-0">
                                                <span class="flex items-center gap-1 min-w-0">

                                                </span>

                                                        class="text-gray-400 hover:text-teal-600 transition shrink-0" title="Dəyiş">
                                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                                    </svg>
                                                </button>
                                            </div>
                                            <div x-show="addressEditing" class="w-full">
                                                <textarea x-model="addressDraft" rows="2" maxlength="500"
                                                          placeholder="Faktiki ünvanı daxil edin..."

                                                <div class="flex items-center gap-2 mt-1">
                                                    <span x-show="addressDraft.trim().length" class="text-[10px] text-gray-400"
                                                          x-text="addressDraft.trim().length + '/500'"></span>

                                                    <button @click="cancelAddressEdit()"

                            </tbody>

                    </div>
                </section>

                <!-- PR #467: Audit sətirləri (Təsdiq/İmtina, Kontaktlar, Timer, MyGov, Ünvan)
                     header-dəki zəng popover-inə keçirildi (auditEntries) -->

                <!-- PR #465/#473: Əlaqə Nömrələri (3-cü grid) — Müştəridən sonra -->
                <section class="panel p-6 flex flex-col">
                    <div class="card-head">
                        <span class="icon-chip">📞</span>
                        <h2 class="panel-title">Əlaqə Nömrələri</h2>
                    </div>
                    <!-- PR #472: klassik table — colgroup (resize enləri) + th/td; zebra nth-child ilə -->
                    <div class="tbl-wrap flex-1" @mousemove.window="onColResize($event)" @mouseup.window="endColResize()">
                        <table class="apl-table">
                            <colgroup>
                                <col :style="'width:' + colWidths.contacts[0] + 'px'">
                                <col :style="'width:' + colWidths.contacts[1] + 'px'">
                                <col :style="'width:' + colWidths.contacts[2] + 'px'">
                                <col :style="'width:' + colWidths.contacts[3] + 'px'">
                                <col :style="'width:' + colWidths.contacts[4] + 'px'">
                                <col :style="'width:' + colWidths.contacts[5] + 'px'">
                                <col :style="'width:' + colWidths.contacts[6] + 'px'">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th class="text-center">№<span class="th-rs" @mousedown.prevent="startColResize('contacts', 0, $event)"></span></th>
                                    <th>Əlaqə<span class="th-rs" @mousedown.prevent="startColResize('contacts', 1, $event)"></span></th>
                                    <th>Telefon<span class="th-rs" @mousedown.prevent="startColResize('contacts', 2, $event)"></span></th>
                                    <!-- PR #510: Kopyala sütunu — Telefondan DƏRHAL sonra -->
                                    <th class="text-center">⧉<span class="th-rs" @mousedown.prevent="startColResize('contacts', 3, $event)"></span></th>
                                    <th>Ad Soyad<span class="th-rs" @mousedown.prevent="startColResize('contacts', 4, $event)"></span></th>
                                    <th>Status<span class="th-rs" @mousedown.prevent="startColResize('contacts', 5, $event)"></span></th>
                                    <th>Qeyd<span class="th-rs" @mousedown.prevent="startColResize('contacts', 6, $event)"></span></th>
                                </tr>
                            </thead>
                            <tbody>
                            <template x-for="(contact, idx) in contacts" :key="idx">
                                <!-- PR #472: hər kontakt klassik <tr> — № | Əlaqə | Telefon | Ad | Status | Qeyd -->
                                <tr>
                                    <td class="text-center"><span class="text-sm font-bold text-gray-400" x-text="(idx+1)"></span></td>
                                    <td class="min-w-0">
                                        <!-- PR #467: qohumluq birbaşa seçilir (edit düyməsi lazımsız — blur-da save) -->
                                        <select x-model="contact.relation"
                                                @blur="onRelationBlur(idx)"
                                                :disabled="isReadOnly"
                                                class="field-input !py-1.5 !px-2 w-full text-sm disabled:opacity-60 disabled:cursor-not-allowed">
                                            <option value="">Əlaqə *</option>
                                            <!-- PR #136: yeni oxunaqlı relation adları + unique məhdudiyyət (Atası/Anası/Qayınatası/Qayınanası) -->
                                            <template x-for="opt in ['Atası','Anası','Qayınatası','Qayınanası','Əri','Arvadı','Oğlu','Qızı','Qardaşı','Bacısı','Bacanağı','Yeznəsi','Baldızı','Qayını','Dostu','Qohumu','Qonşusu','Həmkarı','Digər']" :key="opt">
                                                <option :value="opt" x-text="opt"
                                                        :disabled="isUniqueRelationUsedByOther(idx, opt)"
                                                        :class="isUniqueRelationUsedByOther(idx, opt) ? 'text-gray-300' : ''"></option>
                                            </template>
                                        </select>
                                    </td>
                                    <td class="relative min-w-0">
                                        <input type="text"
                                               x-model="contact.phone"
                                               @input="contact.phone = formatPhone(contact.phone)"
                                               @blur="saveContactIfChanged(idx)"
                                               :disabled="isReadOnly || !contact.relation"
                                               maxlength="17"
                                               placeholder="+994 XX XXX XX XX"
                                               :class="(contact.phone && !isPhoneComplete(contact.phone)) ? 'border-rose-400 focus:border-rose-500 bg-rose-50' : ''"
                                               class="field-input !py-1.5 w-full text-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-gray-100">
                                        <!-- PR #138: nömrə tam deyil xəbərdarlıq ikonu -->
                                        <span x-show="contact.phone && !isPhoneComplete(contact.phone)"
                                              class="absolute right-2 top-1/2 -translate-y-1/2 text-rose-500"
                                              title="Nömrə tam deyil — format: +994 XX XXX XX XX">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                        </span>
                                    </td>
                                    <!-- PR #510: Kopyala sütunu — Telefondan DƏRHAL sonra.
                                         0-formatda (zəng üçün), read-only rejimdə də işləyir. -->
                                    <td class="text-center">
                                        <button x-show="contact.phone && isPhoneComplete(contact.phone)"
                                                @click="copyPhoneLocal(contact.phone)"
                                                class="text-teal-500 hover:text-teal-700 hover:bg-teal-50 inline-flex items-center justify-center w-6 h-6 rounded transition"
                                                :title="'Nömrəni kopyala (0-formatda): ' + phoneLocal(contact.phone)">
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                            </svg>
                                        </button>
                                    </td>
                                    <td class="relative min-w-0">
                                        <input type="text"
                                               x-model.trim="contact.name"
                                               @blur="saveContactIfChanged(idx)"
                                               :disabled="isReadOnly || !contact.relation"
                                               maxlength="35"
                                               placeholder="Ad Soyad"
                                               :class="isNameUsedByOther(idx, contact.name) ? 'border-rose-400 focus:border-rose-500 bg-rose-50' : ''"
                                               class="field-input !py-1.5 w-full text-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-gray-100">
                                        <!-- PR #137: təkrar ad xəbərdarlıq ikonu -->
                                        <span x-show="isNameUsedByOther(idx, contact.name)"
                                              class="absolute right-2 top-1/2 -translate-y-1/2 text-rose-500"
                                              title="Bu ad digər əlaqədə artıq istifadə olunub">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                        </span>
                                    </td>
                                    <td>
                                        <div class="flex gap-1.5 items-center shrink-0">
                                        <!-- Save indicator (PR #465: status hücrəsinə keçirilib) -->
                                        <span x-show="contact.saving" class="text-xs text-gray-400 animate-pulse shrink-0">...</span>
                                        <svg x-show="contact.saved && !contact.saving" class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                                        <!-- Verified badge -->
                                        <span x-show="contact.verified === true" class="badge text-[11px] px-2 py-0.5 bg-emerald-100 text-emerald-700 shrink-0">✓ Təsdiq</span>
                                    <span x-show="contact.verified === false" class="badge text-[11px] px-2 py-0.5 bg-rose-100 text-rose-700 shrink-0">✗ İmtina</span>
                                    <span x-show="contact.verified === null || contact.verified === undefined" class="badge text-[11px] px-2 py-0.5 bg-gray-100 text-gray-500 shrink-0">Yoxlanılmayıb</span>

                                    <!-- Verify/reject buttons — read-only olanda və ya əlaqə/telefon yoxdanda disabled -->
                                    <button x-show="!isReadOnly"
                                            @click="verifyContact(idx, true)"
                                            :disabled="!contact.relation || !contact.phone"
                                            :class="!contact.relation || !contact.phone ? 'opacity-30 cursor-not-allowed' : 'text-emerald-600 hover:text-emerald-800 hover:bg-emerald-50'"
                                            class="inline-flex items-center gap-0.5 text-[11px] font-medium px-1.5 py-1 rounded transition shrink-0"
                                            title="Nömrə doğrulandı — zəng etdiniz və doğru şəxs cavab verdi">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                                    </button>
                                    <button x-show="!isReadOnly"
                                            @click="verifyContact(idx, false)"
                                            :disabled="!contact.relation || !contact.phone"
                                            :class="!contact.relation || !contact.phone ? 'opacity-30 cursor-not-allowed' : 'text-rose-600 hover:text-rose-800 hover:bg-rose-50'"
                                            class="inline-flex items-center gap-0.5 text-[11px] font-medium px-1.5 py-1 rounded transition shrink-0"
                                            title="Nömrə imtina — zəng etdiniz və ya yanlış nömrədir, ya da şəxs münasibəti təsdiqləmədi">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                    </div>
                                    </td>
                                    <!-- PR #467: Qeyd — yeni SÜTUN (alt-sətir əvəzinə) -->
                                    <td>
                                        <div class="flex flex-col items-stretch gap-0.5">
                                        <textarea x-model="contact.callNote"
                                                  @blur="saveContactNote(idx)"
                                                  :disabled="isReadOnly"
                                                  rows="2" maxlength="1000"
                                                  placeholder="Zəng qeydi..."
                                                  class="field-input !py-1 w-full text-sm resize-none disabled:opacity-50 disabled:cursor-not-allowed"></textarea>
                                        <div class="flex items-center justify-between">
                                            <span class="text-[10px] text-gray-400" x-show="contact.noteSaving">Saxlanılır...</span>
                                            <span class="text-[10px] text-emerald-500" x-show="contact.noteSaved && !contact.noteSaving">✓ Saxlanıldı</span>
                                            <span class="text-[10px] text-gray-400 ml-auto" x-text="(contact.callNote || '').length + '/1000'"></span>
                                        </div>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- PR #447/B3: Ekspert Qərarı bölməsi silindi — toolbar-a (A4) köçürüldü -->
                </div><!-- /detail-grid -->

                <!-- PR #312: AZMK imza gözləmə paneli — PR #443: full-width (grid-dən kənar) -->
                <section x-show="app?.status === 'pending_signature' || app?.status === 'disbursing' || app?.status === 'disbursed' || app?.status === 'disburse_failed'" class="panel p-6 mt-6">
                    <div class="card-head">
                        <span class="icon-chip">✍️</span>
                        <h3 class="panel-title text-lg font-bold" x-text="app?.status === 'disbursed' ? 'Kredit verildi (disbursed)' : (app?.status === 'disbursing' ? 'Kredit köçürülür (disbursing)' : (app?.status === 'disburse_failed' ? 'Köçürmə xətası — manual yoxlama lazımdır' : 'Müqavilə imzası gözlənir'))"></h3>
                    </div>
                    <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3 text-sm text-indigo-900"
                         x-show="app?.status === 'pending_signature'">
                        AZMK-da kredit müraciəti yaradılıb. Müştəri müqaviləni imzalayana qədər
                        sistem avtomatik olaraq statusu yoxlayır (hər bir neçə dəqiqədən bir).
                        Müştəri imzaladıqda kredit avtomatik olaraq kartına köçürülür.
                    </div>
                    <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm text-emerald-900"
                         x-show="app?.status === 'disbursed'">
                        Müştəri müqaviləni imzaladı və kredit məbləği kartına köçürüldü.
                    </div>
                    <div class="bg-orange-50 border border-orange-200 rounded-lg p-3 text-sm text-orange-900"
                         x-show="app?.status === 'disbursing'">
                        Müştəri imzaladı — AZMK disburse sorğusu göndərilir. Bu keçid statusdur
                        (adətən bir neçə saniyə çəkir); proses bu anda yenidən başlayarsa
                        müraciət avtomatik "manual yoxlama" statusuna keçəcək.
                    </div>
                    <div class="bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-900"
                         x-show="app?.status === 'disburse_failed'">
                        <div class="font-semibold mb-1">Köçürmə (disburse) alınmadı və ya nəticəsi naməlumdur.</div>
                        Sistem təkrar cəhd ETMİR (cüt köçürmə riskinə görə). Zəhmət olmasa AZMK
                        tərəfindən bu application üçün pulun keçib-keçmədiyini yoxlayın:
                        <div class="font-mono break-all mt-1 bg-white/60 rounded p-1.5" x-text="app?.rejection_reason || '-'"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3 text-sm">
                        <div>
                            <div class="text-gray-500 text-xs mb-0.5">AZMK Application ID</div>
                            <div class="font-mono break-all" x-text="app?.lw_application_id || '-'"></div>
                        </div>
                        <div>
                            <div class="text-gray-500 text-xs mb-0.5">AZMK Kredit № (loanId)</div>
                            <div class="font-mono break-all" x-text="app?.azmk_loan_id || '-'"></div>
                        </div>
                        <div>
                            <div class="text-gray-500 text-xs mb-0.5">Yaradılma vaxtı (AZMK)</div>
                            <div class="font-mono break-all" x-text="app?.azmk_created_at || '-'"></div>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>
    </template>

    <script>
        function appDetail() {
            return {
                app: null,
                loading: false,
                error: '',
                actionLoading: false,
                actionMessage: '',
                actionError: '',
                rejectReason: '',
                // PR #509: theme state silindi — RDC həmişə light

                // PR #142: Auth
                authChecking: true,
                currentUser: null,

                // Contacts (PR #84, PR #125: verified status + auto-save, PR #128: name field, PR #132: editing)
                contacts: [
                    { relation: '', phone: '', name: '', saved: false, saving: false, savedPhone: '', savedRelation: '', savedName: '', verified: null, editing: false },
                    { relation: '', phone: '', name: '', saved: false, saving: false, savedPhone: '', savedRelation: '', savedName: '', verified: null, editing: false },
                    { relation: '', phone: '', name: '', saved: false, saving: false, savedPhone: '', savedRelation: '', savedName: '', verified: null, editing: false },
                ],

                // PR #134: Timer
                timerSeconds: 0,
                timerInterval: null,
                timerStopped: false,

                // PR #134: Precondition yoxlamaları
                complianceChecked: false,
                employmentLoading: false,
                employmentVerifying: false,
                employmentResult: '',
                employmentMessage: '',
                // PR #238: EMPLOYMENT_TENURE imtina dialoqu
                empRejectModalOpen: false,
                empRejectModalReason: '',
                pensionLoading: false,
                pensionVerifying: false,
                pensionResult: '',
                pensionMessage: '',

                // PR #415: MyGov düymə cooldown-ları — klikdən sonra 10 san deaktiv,
                // üzərində qalan saniyə görünür; bitəndə yenidən aktivləşir.
                // 'passed' nəticəsində düymələr tam deaktiv qalır (:disabled şərti).
                mygovCooldown: { empReq: 0, empVerify: 0, penReq: 0, penVerify: 0 },
                cooldownTimers: {},

                // PR #399: Video verifikasiya (dashboard)
                videoLoading: false,
                videoMessage: '',
                videoError: false,
                videoDialogOpen: false,
                videoStreamUrl: '',
                videoStreamLoading: false,
                videoStreamError: '',
                // PR #449: prefetch olunmuş stream URL — səhifə yüklənəndə arxa fonda
                // alınır, klikdə dialoq ANINDA açılır (backend roundtrip gözlənilmir)
                videoStreamUrlReady: '',

                // PR #428: dialoq drag (sürüşdürmə) vəziyyəti — başlıqdan tutub
                // hərəkət etdirmək olur; translate offset-ləri mərkəzdən hesablanır
                videoDragging: false,
                videoDragX: 0,
                videoDragY: 0,
                videoDragStartX: 0,
                videoDragStartY: 0,
                videoDragOrigX: 0,
                videoDragOrigY: 0,

                // PR #402/#405: addım checkmark-ları. Video ✓-ləri YALNIZ düymə
                // klikində yaranır (session-only — backend statusu / localStorage
                //! göstərmir). Komplayans/MyGov ✓-ləri localStorage-da qalır.
                videoOrderSent: false,   // "Video müraciət göndər" kliklənib (bu sessiya)
                videoWatched: false,     // video REAL yüklənib (loadeddata hadisəsi)
                // PR #440: yeni video order gözləyir (çəkilməyib) — panel xəbərdarlığı.
                // Set: videoRequest() ugurunda, dialoq xətasinda ("çəkilməyib"),
                // sehife yuklenende (DB statusundan). Reset: dialoq ugurunda.
                videoPendingNew: false,
                videoBackendRequired: false, // PR #405: backend video_required — approve qadağası üçün
                compliance: { name: false, hms: false, os: false },
                employmentSMSDone: false,
                employmentVerified: false,
                pensionSMSDone: false,
                pensionVerified: false,

                // PR #245: Ünvanlar — qeydiyyat (read-only, AZMK) + faktiki (ekspert redaktəsi)
                addressEditing: false,
                addressDraft: '',
                addressSaving: false,

                // PR #408/#412: müştəri şəkli — DEFAULT olaraq siluet göstərilir;
                // AZMK PersonalInfo-dan real Image gələndə əvəz olunur.
                customerPhoto: '/assets/sample-customer-photo.jpg',
                photoDialogOpen: false,

                // PR #467: üzən şəkil paneli — sürükləmə vəziyyəti
                photoDrag: { active: false, dx: 0, dy: 0 },
                photoPos: { x: 0, y: 0 },

                // PR #467: audit tarixçəsi popover-i
                auditOpen: false,

                // PR #509: initTheme/toggleTheme silindi — RDC həmişə light.

                // PR #142: Auth
                async init() {
                    // PR #509: initTheme silindi — RDC həmişə light
                    // PR #443: setupFit (adaptive zoom) silindi — yeni 3-sütunlu
                    // dizayn təbii scroll ilə işləyir
                    await this.checkAuth();
                    if (this.currentUser) {
                        this.load();
                    }
                },

                async checkAuth() {
                    try {
                        const resp = await fetch('/api/auth/me');
                        if (resp.status === 401) {
                        window.clearAuthToken();
                            window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                            return;
                        }
                        if (!resp.ok) throw new Error('Auth yoxlanıla bilmədi');
                        this.currentUser = await resp.json();
                        // PR #497: authChecking yalnız uğurda söndürülür (flash fix — finally-dən köçürülüb).
                        this.authChecking = false;
                    } catch (e) {
                        window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                        return;
                    }
                },
                async logout() {
                    try {
                        await fetch('/api/auth/logout', { method: 'POST' });
                    window.clearAuthToken();
                    } catch (e) { /* ignore */ }
                    window.location.href = '/login';
                },

                // PR #467: üzən şəkil panelini aç — ilk dəfə sağ yuxarıda görünür
                openPhoto() {
                    if (!this.photoPos.x) {
                        this.photoPos.x = Math.max(16, window.innerWidth - 350);
                        this.photoPos.y = 110;
                    }
                    this.photoDialogOpen = true;
                },
                // PR #467: paneli başlıq zolağından sürükləmək
                startPhotoDrag(e) {
                    if (!e) return;
                    this.photoDrag.active = true;
                    this.photoDrag.dx = e.clientX - this.photoPos.x;
                    this.photoDrag.dy = e.clientY - this.photoPos.y;
                },
                onPhotoDrag(e) {
                    if (!this.photoDrag.active || !e) return;
                    this.photoPos.x = Math.max(0, Math.min(window.innerWidth - 80, e.clientX - this.photoDrag.dx));
                    this.photoPos.y = Math.max(0, Math.min(window.innerHeight - 60, e.clientY - this.photoDrag.dy));
                },

                // PR #467: audit girişləri — bütün dəyişikliklər xronoloji (yeni yuxarıda)
                get auditEntries() {
                    const app = this.app || {};
                    const entries = [];
                    if (app.processed_by_username) entries.push({ label: 'Təsdiq/İmtina edən', user: app.processed_by_username, at: null });
                    if (app.contacts_updated_by_username) entries.push({ label: 'Kontaktları yeniləyən', user: app.contacts_updated_by_username, at: app.contacts_updated_at || null });
                    if (app.timer_updated_by_username) entries.push({ label: 'Timer saxlayan', user: app.timer_updated_by_username, at: null });
                    if (app.mygov_checked_by_username) entries.push({ label: 'MyGov yoxlayan', user: app.mygov_checked_by_username, at: app.mygov_checked_at || null });
                    if (app.actual_address_updated_by_username) entries.push({ label: 'Ünvanı yeniləyən', user: app.actual_address_updated_by_username, at: app.actual_address_updated_at || null });
                    entries.sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0));
                    return entries;
                },

                // PR #468/#472: resizable sütunlar — colgroup <col> enləri (minimum).
                // table-layout:auto: məzmun geniş olsa sütun avtomatik genişlənir —
                // üst-üstə düşmə mümkünsüz, colWidths yalnız başlanğıc/en aşağı həddidir.
                colWidths: {
                    cust: [110, 700, 320],
                    // PR #510: kredit sırası — Müddət | Komissiya | Komissiya ₼ | İllik faiz |
