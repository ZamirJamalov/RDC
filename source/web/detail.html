                    // Faiz məbləği | Aylıq ödəniş | Karta köçürülən | Yekun ödəniş
                    kredit: [110, 130, 110, 140, 140, 140, 180, 140],
                    // PR #510: ⧉ Kopyala sütunu Telefon-dan dərhal sonra
                    contacts: [28, 130, 165, 44, 180, 200, 240],
                },
                colResize: { table: null, idx: -1, startX: 0, startW: 0 },
                startColResize(table, idx, e) {
                    this.colResize = { table, idx, startX: e.clientX, startW: this.colWidths[table][idx] };
                    document.body.style.userSelect = 'none';
                    document.body.style.cursor = 'col-resize';
                },
                onColResize(e) {
                    const r = this.colResize;
                    if (!r.table || r.idx < 0 || !e) return;
                    this.colWidths[r.table][r.idx] = Math.max(28, r.startW + (e.clientX - r.startX));
                },
                endColResize() {
                    this.colResize = { table: null, idx: -1, startX: 0, startW: 0 };
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                },

                // PR #468: telefonu 0-formatda göstər (+994501234567 → 0501234567)
                phoneLocal(phone) {
                    if (!phone) return '-';
                    let d = String(phone).replace(/\D/g, '');
                    if (d.startsWith('994')) d = '0' + d.slice(3);
                    return d;
                },

                // PR #509: Kredit xülasəsi hesablayıcıları — apply.html-in
                // "Kredit xülasəsi" paneli ilə EYNİ formullar (drift olmasın deyə
                // burada dafrontend-də hesablanır):
                //   aylıq ödəniş  A = K × i / (1 − (1+i)^−n), i = illik/100/12
                //   yekun ödəniş = ceil(A × n)
                //   komissiya ₼  = total_amount − amount (total = ceil(amount + komissiya))
                get creditCalcReady() {
                    const a = this.app;
                    return !!(a && a.total_amount > 0 && a.amount > 0 && a.term_months > 0 && a.annual_interest_rate > 0);
                },
                get monthlyPaymentAz() {
                    if (!this.creditCalcReady) return '-';
                    const K = this.app.total_amount;
                    const i = this.app.annual_interest_rate / 100 / 12;
                    const n = this.app.term_months;
                    const A = K * i / (1 - Math.pow(1 + i, -n));
                    return (Math.round(A * 100) / 100).toFixed(2) + ' AZN';
                },
                get totalRepaymentAz() {
                    if (!this.creditCalcReady) return '-';
                    const K = this.app.total_amount;
                    const i = this.app.annual_interest_rate / 100 / 12;
                    const n = this.app.term_months;
                    const A = K * i / (1 - Math.pow(1 + i, -n));
                    return Math.ceil(A * n) + ' AZN';
                },
                get commissionAmountAz() {
                    const a = this.app;
                    if (!a || !(a.total_amount > 0) || !(a.amount > 0)) return '-';
                    return (a.total_amount - a.amount).toFixed(2) + ' AZN';
                },
                // PR #510: müddət üzrə ödəniləcək faiz məbləği (apply.html interestAmount
                // ilə eyni qayda): ceil-lənmiş yekun ödəniş − ceil-lənmiş kredit
                // (total_amount) — hər ikisi tam manat olduğundan nəticə tam ededir.
                get interestAmountAz() {
                    if (!this.creditCalcReady) return '-';
                    const K = this.app.total_amount;
                    const i = this.app.annual_interest_rate / 100 / 12;
                    const n = this.app.term_months;
                    const A = K * i / (1 - Math.pow(1 + i, -n));
                    return (Math.ceil(A * n) - K) + ' AZN';
                },

                // PR #468: mətni n simvolla qısalt (sonda …)
                trunc(s, n = 35) {
                    s = (s || '').trim();
                    if (!s) return '-';
                    return s.length > n ? s.slice(0, n) + '…' : s;
                },

                // PR #101: müştəri adını clipboard-a kopyala (komplyans yoxlaması üçün)
                async copyToClipboard(text) {
                    if (!text) return;
                    try {
                        await navigator.clipboard.writeText(text);
                        // qısa visual feedback
                        this.actionMessage = 'Ad kopyalandı: ' + text;
                        setTimeout(() => { if (this.actionMessage.startsWith('Ad kopyalandı')) this.actionMessage = ''; }, 2000);
                    } catch (e) {
                        // fallback — köhnə brauzerlər üçün
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy'); } catch (_) {}
                        document.body.removeChild(ta);
                    }
                },

                // PR #463: telefon nömrəsini LOKAL formatda kopyala —
                // 994 prefix-i silinir, əvvəlinə 0 qoyulur (+994501234567 → 0501234567).
                // Zəng etmək üçün dialer-də birbaşa istifadə olunur.
                async copyPhoneLocal(phone) {
                    if (!phone) return;
                    let digits = String(phone).replace(/\D/g, '');
                    if (digits.startsWith('994')) digits = '0' + digits.slice(3);
                    try {
                        await navigator.clipboard.writeText(digits);
                        this.actionMessage = 'Nömrə kopyalandı: ' + digits;
                        setTimeout(() => { if (this.actionMessage.startsWith('Nömrə kopyalandı')) this.actionMessage = ''; }, 2000);
                    } catch (e) {
                        const ta = document.createElement('textarea');
                        ta.value = digits;
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy'); } catch (_) {}
                        document.body.removeChild(ta);
                    }
                },

                // PR #136: yalnız bu 4 əlaqə növü unikaldır — 3 kontakt arasında yalnız 1 dənə ola bilər
                // (Atası, Anası, Qayınatası, Qayınanası). Digər əlaqələr (Qardaşı, Dostu, və s.) təkrarlana bilər.
                uniqueRelations: ['Atası', 'Anası', 'Qayınatası', 'Qayınanası'],

                // PR #136: unique relation başqa kontakt tərəfindən istifadə olunubmu?
                // Yalnız uniqueRelations massivində olan əlaqələr üçün yoxlama edilir.
                isUniqueRelationUsedByOther(currentIdx, relation) {
                    if (!relation) return false;
                    if (!this.uniqueRelations.includes(relation)) return false;
                    return this.contacts.some((c, i) => i !== currentIdx && c.relation === relation);
                },

                // PR #137: kontakt adı (Ad Soyad) başqa kontakt tərəfindən istifadə olunubmu?
                // Case-insensitive + trim müqayisə. Boş adlar yoxlanılmır.
                // UI-dan daxil edilən zaman təkrarın qarşısını alır (DB-də yox).
                isNameUsedByOther(currentIdx, name) {
                    if (!name) return false;
                    const n = String(name).trim().toLowerCase();
                    if (!n) return false;
                    return this.contacts.some((c, i) =>
                        i !== currentIdx &&
                        c.name &&
                        String(c.name).trim().toLowerCase() === n
                    );
                },

                // PR #138: telefon nömrəsi tam daxil edilibmi?
                // Tam format: +994 XX XXX XX XX  →  +994 + 9 rəqəm  →  13 simvol (boşluqsuz)
                // Yalnız tam olanda DB-yə yazılır. "+" və ya "+994 50" kimi qismi dəyərlər yoxlanılmır.
                isPhoneComplete(phone) {
                    if (!phone) return false;
                    // Boşluqları sil, yalnız + və rəqəm saxla
                    const digits = String(phone).replace(/[^\d+]/g, '');
                    // Tam format: +994 + 9 rəqəm = 13 simvol
                    return /^\+994\d{9}$/.test(digits);
                },

                // PR #136: köhnə DB dəyərlərini yeni oxunaqlı formaya normalizə edir
                // (Ata → Atası, Qaynata → Qayınatası, və s.) — load() zamanı çağrılır
                normalizeRelation(r) {
                    if (!r) return '';
                    const map = {
                        'Ata': 'Atası',
                        'Ana': 'Anası',
                        'Qardaş': 'Qardaşı',
                        'Bacı': 'Bacısı',
                        'Dost': 'Dostu',
                        'Ər': 'Əri',
                        'Arvad': 'Arvadı',
                        'Oğul': 'Oğlu',
                        'Qız': 'Qızı',
                        'Qaynata': 'Qayınatası',
                        'Qaynana': 'Qayınanası',
                        'Qayın': 'Qayını',
                        'Bacanaq': 'Bacanağı',
                        'Baldız': 'Baldızı',
                        'Yeznə': 'Yeznəsi',
                    };
                    return map[r] || r;
                },

                // PR #135: read-only status — approved/rejected olanda bütün kontakt inputları disabled
                get isReadOnly() {
                    return this.app && (this.app.status === 'approved' || this.app.status === 'rejected' || this.app.status === 'pending_signature' || this.app.status === 'disbursed' || this.app.status === 'disbursing' || this.app.status === 'disburse_failed');
                },

                // PR #134: Timer display (00:00:00 format)
                get timerDisplay() {
                    const s = this.timerSeconds;
                    const h = String(Math.floor(s / 3600)).padStart(2, '0');
                    const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
                    const sec = String(s % 60).padStart(2, '0');
                    return `${h}:${m}:${sec}`;
                },

                // PR #134: Timer start
                startTimer() {
                    if (this.timerInterval) return;
                    if (this.app && this.app.timer_seconds) {
                        this.timerSeconds = this.app.timer_seconds;
                    }
                    this.timerStopped = false;
                    this.timerInterval = setInterval(() => {
                        if (this.timerStopped) return;
                        this.timerSeconds++;
                        if (this.timerSeconds % 10 === 0) {
                            this.saveTimerToDB();
                        }
                    }, 1000);
                },

                // PR #134: Timer stop
                stopTimer() {
                    this.timerStopped = true;
                    if (this.timerInterval) {
                        clearInterval(this.timerInterval);
                        this.timerInterval = null;
                    }
                    this.saveTimerToDB();
                },

                // PR #134: Timer DB-yə saxla
                async saveTimerToDB() {
                    if (!this.id) return;
                    try {
                        await fetch('/api/applications/' + this.internalId + '/timer', {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ timer_seconds: this.timerSeconds }),
                        });
                    } catch (e) { /* silent fail */ }
                },

                // PR #134: Approve precondition yoxlamaları
                // PR #137: kontakt adlarının təkrarı da approve üçün maneədir
                // PR #138: nömrə tam daxil edilmeyibse approve üçün maneədir
                checkApprovePreconditions() {
                    const errors = [];
                    for (let i = 0; i < 3; i++) {
                        const c = this.contacts[i];
                        if (!c || !c.phone) {
                            errors.push(`Kontakt ${i+1}: Nömrə daxil edilməyib`);
                        } else if (!this.isPhoneComplete(c.phone)) {
                            errors.push(`Kontakt ${i+1}: Nömrə tam deyil (+994 XX XXX XX XX)`);
                        } else if (c.verified !== true) {
                            errors.push(`Kontakt ${i+1}: Təsdiq olunmayıb`);
                        }
                        // PR #137: ad təkrarı yoxlaması
                        if (c && c.name && this.isNameUsedByOther(i, c.name)) {
                            errors.push(`Kontakt ${i+1}: Adı digər əlaqədə təkrarlanır`);
                        }
                    }
                    // PR #226: MyGov ön şərtləri pending_expert üçün də tələb olunur
                    // (MyGov paneli bu statusda göstərilir — PR #224)
                    // PR #274: İş yeri və pensiya yoxlamalarından ən azı BİRİ keçilməlidir
                    // (hər ikisi eyni anda tələb olunmur — biri kifayətdir)
                    if (this.app?.status === 'pending_approval' || this.app?.status === 'pending_expert') {
                        const empPassed = this.employmentResult === 'passed';
                        const penPassed = this.pensionResult === 'passed';
                        if (!empPassed && !penPassed) {
                            errors.push('MyGov: İş yeri və ya Pensiya yoxlamasından ən azı biri keçilməlidir');
                        }
                    }
                    // PR #413: komplayansın HƏR 3 düyməsi klik olunmalıdır
                    // (name + HMS + OpenSanctions). Əvvəl yalnız complianceChecked
                    // yoxlanılırdı — bir düymə kifayət edirdi.
                    if (!this.compliance.name || !this.compliance.hms || !this.compliance.os) {
                        errors.push('Komplayans: Ad, HMS və OpenSanctions yoxlamalarının HƏR 3-ü açılmalıdır');
                    }
                    // PR #405: video baxışı tələb olunur — yalnız backend video_required=true
                    // olanda (video deaktiv olanda approve bloklanmır). ✓ yalnız video
                    // real yüklənəndə qoyulur (loadeddata), ona görə baxılmayan video approve-i blokluyur.
                    // PR #436: yeni video order göndərilibsə videoWatched reset olunur —
                    // yeni video çəkilənə qədər approve qadağası qalır.
                    if (this.videoBackendRequired && !this.videoWatched) {
                        errors.push(this.videoOrderSent
                            ? 'Video: yeni video çəkilənə qədər gözləməlisiniz (baxış statusu sıfırlanıb)'
                            : 'Video: əvvəlcə “Videya bax” düyməsi ilə videoya baxılmalıdır');
                    }
                    return errors;
                },

                // PR #101/#129: telefon nömrəsinin formatını tənzimlə
                // Format: +994 XX XXX XX XX
                // - boşdürsə +994 ilə başlat
                // - yalnız rəqəm və + qəbul et
                // - maksimum 13 simvol: +994XXXXXXXXX
                // - vizual format: +994 və sonra XX XXX XX XX (boşluqlarla)
                formatPhone(value) {
                    if (!value) return '';
                    let v = value;
                    // əgər istifadəçi +994 yazmayıbsa, avtomatik əlavə et
                    if (!v.startsWith('+')) {
                        if (v.startsWith('994')) v = '+' + v;
                        else if (v.startsWith('0')) v = '+994' + v.substring(1);
                        else if (/^\d/.test(v)) v = '+994' + v;
                    }
                    // yalnız rəqəm və + saxla
                    v = v.replace(/[^\d+]/g, '');
                    // birdən çox + olmasın
                    v = v.replace(/\+/g, ''); v = '+' + v;
                    // maksimum 13 simvol (+994 + 9 rəqəm)
                    if (v.length > 13) v = v.substring(0, 13);

                    // PR #129: vizual format +994 XX XXX XX XX
                    // +994 mövcuddursa, qalan rəqəmləri format et
                    if (v.startsWith('+994') && v.length > 4) {
                        let digits = v.substring(4); // 994-dən sonrakı rəqəmlər
                        let formatted = '+994';
                        if (digits.length > 0) formatted += ' ' + digits.substring(0, 2);
                        if (digits.length > 2) formatted += ' ' + digits.substring(2, 5);
                        if (digits.length > 5) formatted += ' ' + digits.substring(5, 7);
                        if (digits.length > 7) formatted += ' ' + digits.substring(7, 9);
                        return formatted;
                    }
                    return v;
                },

                // PR #132: əlaqə blur — edit bitdi, saxla və editing-i bağla
                async onRelationBlur(idx) {
                    const c = this.contacts[idx];
                    if (!c) return;
                    // Əgər editing varsa və əlaqə boşdursa — köhnə dəyəri qaytar
                    if (c.editing && !c.relation && c.savedRelation) {
                        c.relation = c.savedRelation;
                        c.editing = false;
                        return;
                    }
                    // Saxla
                    await this.saveContactIfChanged(idx);
                    // Editing-i bağla
                    c.editing = false;
                },

                // PR #125: blur-da avtomatik saxla (yalnız dəyişiklik olarsa)
                // PR #128: name field də dəyişiklik yoxlamasına daxil
                // PR #131: əlaqə seçilmədən input disabled olduğu üçün burada ekstra yoxlama yoxdur
                // PR #136: ad sahəsinə trim tətbiq olunur (x-model.trim + burada explicit .trim())
                // PR #137: təkrar ad yoxlaması — eyni ad başqa kontakt-da varsa saxlamaq olmaz
                // PR #138: yalnız tam nömrə (+994 XX XXX XX XX) saxlanılır — qismi dəyərlər yox
                async saveContactIfChanged(idx) {
                    const c = this.contacts[idx];
                    if (!c) return;
                    // PR #136: adı hər halda trim et — DB-yə boşluqsuz yaz
                    c.name = (c.name || '').trim();
                    // Dəyişiklik yoxdursa — skip
                    if (c.phone === c.savedPhone && c.relation === c.savedRelation && c.name === c.savedName) return;
                    // Boş telefon və ya əlaqə yoxdursa — skip
                    if (!c.phone || !c.relation) return;
                    // PR #138: nömrə tam deyilsə — saxlama
                    if (!this.isPhoneComplete(c.phone)) {
                        // Əgər köhnə saxlanmış tam nömrə varsa — onu qaytar (qismi dəyəri DB-yə yazma)
                        if (c.savedPhone && this.isPhoneComplete(c.savedPhone)) {
                            c.phone = c.savedPhone;
                        }
                        // Qısa xəbərdarlıq (yalnız əgər dəyişiklik edilibsə və qeyri-boşdursa)
                        if (c.phone && c.phone !== c.savedPhone) {
                            this.actionError = `Kontakt ${idx + 1}: Nömrə tam deyil. Format: +994 XX XXX XX XX`;
                            setTimeout(() => {
                                if (this.actionError && this.actionError.startsWith(`Kontakt ${idx + 1}: Nömrə tam deyil`)) this.actionError = '';
                            }, 5000);
                        }
                        return;
                    }
                    // PR #137: təkrar ad yoxlaması — başqa kontakt-da eyni ad varsa saxlama
                    if (c.name && this.isNameUsedByOther(idx, c.name)) {
                        this.actionError = `Kontakt ${idx + 1}: "${c.name}" adı artıq digər əlaqədə istifadə olunub. Təkrar ad daxil edilə bilməz.`;
                        setTimeout(() => {
                            if (this.actionError && this.actionError.startsWith(`Kontakt ${idx + 1}:`)) this.actionError = '';
                        }, 6000);
                        // Köhnə saxlanmış dəyəri qaytar — yeni dəyəri DB-yə yazma
                        c.name = c.savedName || '';
                        return;
                    }

                    c.saving = true;
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/contacts', {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                contact1_phone: this.contacts[0]?.phone || '',
                                contact1_relation: this.contacts[0]?.relation || '',
                                contact1_name: this.contacts[0]?.name || '',
                                contact1_verified: this.contacts[0]?.verified ?? null,
                                contact2_phone: this.contacts[1]?.phone || '',
                                contact2_relation: this.contacts[1]?.relation || '',
                                contact2_name: this.contacts[1]?.name || '',
                                contact2_verified: this.contacts[1]?.verified ?? null,
                                contact3_phone: this.contacts[2]?.phone || '',
                                contact3_relation: this.contacts[2]?.relation || '',
                                contact3_name: this.contacts[2]?.name || '',
                                contact3_verified: this.contacts[2]?.verified ?? null,
                            }),
                        });
                        if (!resp.ok) throw new Error('Saxlanilmadi');
                        c.saved = true;
                        c.savedPhone = c.phone;
                        c.savedRelation = c.relation;
                        c.savedName = c.name;
                    } catch (e) {
                        this.actionError = 'Kontakt saxlanilmadi: ' + e.message;
                        setTimeout(() => { this.actionError = ''; }, 5000);
                    } finally {
                        c.saving = false;
                    }
                },

                // PR #245: faktiki ünvan redaktəsi
                startAddressEdit() {
                    this.addressDraft = this.app?.actual_address || '';
                    this.addressEditing = true;
                },
                cancelAddressEdit() {
                    this.addressEditing = false;
                    this.addressDraft = '';
                },
                async saveAddress() {
                    const addr = (this.addressDraft || '').trim();
                    if (!addr) return;
                    this.addressSaving = true;
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/address', {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ actual_address: addr }),
                        });
                        if (!resp.ok) {
                            const e = await resp.json().catch(() => ({}));
                            throw new Error(e.error || 'Saxlanılmadı');
                        }
                        this.app.actual_address = addr;
                        this.addressEditing = false;
                        this.actionMessage = 'Faktiki ünvan saxlanıldı.';
                        setTimeout(() => { if (this.actionMessage === 'Faktiki ünvan saxlanıldı.') this.actionMessage = ''; }, 4000);
                    } catch (e) {
                        this.actionError = 'Faktiki ünvan saxlanılmadı: ' + e.message;
                        setTimeout(() => { this.actionError = ''; }, 5000);
                    } finally {
                        this.addressSaving = false;
                    }
                },
                // PR #245: qeydiyyat ünvanı boşdursa AZMK-dən doldur (one-time backfill, arxa fonda)
                async backfillRegistrationAddress() {
                    if (!this.app || this.app.registration_address) return;
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/registration-address', { method: 'POST' });
                        if (!resp.ok) return;
                        const data = await resp.json();
                        if (data.registration_address) this.app.registration_address = data.registration_address;
                        if (data.customer_full_name && !this.app.customer_full_name) this.app.customer_full_name = data.customer_full_name;
                    } catch (e) { /* silent — UI-da '-' qalır */ }
                },

                // PR #125: yoxlama düymələri (verify/reject)
                // PR #137: təkrar ad varsa verify/reject etmək olmaz
                // PR #138: nömrə tam deyilsə verify/reject etmək olmaz
                // PR #266: zəng qeydini blur olanda save et
                async saveContactNote(idx) {
                    const c = this.contacts[idx];
                    if (!c) return;
                    c.noteSaving = true;
                    c.noteSaved = false;
                    try {
                        const resp = await fetch(`/api/applications/${this.internalId}/contact-notes`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contact1_call_note: this.contacts[0]?.callNote || '',
                                contact2_call_note: this.contacts[1]?.callNote || '',
                                contact3_call_note: this.contacts[2]?.callNote || '',
                            })
                        });
                        if (!resp.ok) throw new Error('Qeyd saxlanılmadı');
                        c.noteSaved = true;
                        setTimeout(() => { c.noteSaved = false; }, 3000);
                    } catch (e) {
                        this.actionError = `Kontakt ${idx + 1}: qeyd saxlanılmadı — ${e.message}`;
                        setTimeout(() => { this.actionError = ''; }, 5000);
                    } finally {
                        c.noteSaving = false;
                    }
                },

                async verifyContact(idx, verified) {
                    const c = this.contacts[idx];
                    if (!c || !c.phone) return;
                    // PR #138: nömrə tam deyilsə — yoxlamağa icazə vermə
                    if (!this.isPhoneComplete(c.phone)) {
                        this.actionError = `Kontakt ${idx + 1}: Nömrə tam deyil. Format: +994 XX XXX XX XX`;
                        setTimeout(() => {
                            if (this.actionError && this.actionError.startsWith(`Kontakt ${idx + 1}: Nömrə tam deyil`)) this.actionError = '';
                        }, 5000);
                        return;
                    }
                    // PR #137: ad təkrarı varsa — yoxlamağa icazə vermə
                    if (c.name && this.isNameUsedByOther(idx, c.name)) {
                        this.actionError = `Kontakt ${idx + 1}: adı digər əlaqədə təkrarlanır. Əvvəlcə adı düzəlt.`;
                        setTimeout(() => {
                            if (this.actionError && this.actionError.startsWith(`Kontakt ${idx + 1}:`)) this.actionError = '';
                        }, 6000);
                        return;
                    }

                    c.verified = verified;
                    c.saving = true;
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/contacts', {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                contact1_phone: this.contacts[0]?.phone || '',
                                contact1_relation: this.contacts[0]?.relation || '',
                                contact1_name: this.contacts[0]?.name || '',
                                contact1_verified: this.contacts[0]?.verified ?? null,
                                contact2_phone: this.contacts[1]?.phone || '',
                                contact2_relation: this.contacts[1]?.relation || '',
                                contact2_name: this.contacts[1]?.name || '',
                                contact2_verified: this.contacts[1]?.verified ?? null,
                                contact3_phone: this.contacts[2]?.phone || '',
                                contact3_relation: this.contacts[2]?.relation || '',
                                contact3_name: this.contacts[2]?.name || '',
                                contact3_verified: this.contacts[2]?.verified ?? null,
                            }),
                        });
                        if (!resp.ok) throw new Error('Saxlanilmadi');
                        c.saved = true;
                    } catch (e) {
                        this.actionError = 'Yoxlama saxlanilmadi: ' + e.message;
                        setTimeout(() => { this.actionError = ''; }, 5000);
                    } finally {
                        c.saving = false;
                    }
                },

                get id() {
                    return new URLSearchParams(window.location.search).get('id');
                },

                // PR #191: internalId — INT id (ekspert API call-lar üçün), app yüklənəndə set olunur
                get internalId() {
                    return this.app?.id || '';
                },

                // PR #441: imtina səbəbləri — statusa görə. disburse_failed-də
                // (yalnız admin görür — bölmənin x-show şərti) TƏKCƏ disburse
                // xətası səbəbi var, 0 gün gözləmə ilə.
                get rejectOptions() {
                    if (this.app?.status === 'disburse_failed') {
                        return [
                            { value: 'MANUAL_DISBURSE_FAILED', label: 'Disburse xətası — köçürmə alınmadı (0 gün gözləmə)' },
                        ];
                    }
                    return [
                        { value: 'MANUAL_VIDEO_MISMATCH', label: 'Video uyğunsuzluq (1 gün gözləmə)' },
                        { value: 'MANUAL_COMPLIANCE_FAILED', label: 'Open Sanction və HMS yoxlama (daimi — təkrar müraciət mümkün deyil)' },
                        { value: 'MANUAL_NUMBER_NOT_PROVIDED', label: 'Nömrə təqdim etmir (24 saat)' },
                        { value: 'MANUAL_CONTACTS_NEGATIVE', label: 'Əlaqə nömrələrindən mənfi rəy (14 gün)' },
                        { value: 'MANUAL_ROUGH_BEHAVIOR', label: 'Müştərinin kobud rəftarı (10 gün)' },
                        { value: 'MANUAL_CALL_INTERFERENCE', label: 'Zəng zamanı kənar müdaxilə (0 gün)' },
                        { value: 'MANUAL_WRONG_INFO', label: 'Yanlış məlumat (10 gün gözləmə)' },
                        { value: 'MANUAL_GETCONTACT_NEGATIVE', label: 'GetContact — mənfi taq (30 gün)' },
                    ];
                },

                // PR #402: ekspert addım checkmark-ları — localStorage-da app-a görə saxlanılır.
                // Faktiki ünvan ✓ backend audit-dən (actual_address_updated_*), video order ✓
                // backend-dən (video_records) gəlir — qalanı lokal işarələmədir.
                markDone(key) {
                    const map = {
                        compliance_name: () => { this.compliance.name = true; this.complianceChecked = true; }, // PR #406: klik də precondition-i qane edir
                        compliance_hms: () => this.compliance.hms = true,
                        compliance_os: () => this.compliance.os = true,
                        emp_req: () => this.employmentSMSDone = true,
                        emp_verify: () => this.employmentVerified = true,
                        // PR #406: nəticə özü də saxlanılır — siyahıya qayıdıb geri
                        // gələndə approve precondition-i yenidən keçilsin (✓ ilə birgə)
                        emp_passed: () => this.employmentResult = 'passed',
                        pen_req: () => this.pensionSMSDone = true,
                        pen_verify: () => this.pensionVerified = true,
                        pen_passed: () => this.pensionResult = 'passed',
                    };
                    if (map[key]) map[key]();
                    try { localStorage.setItem('alpul_done_' + this.internalId + '_' + key, '1'); } catch (e) { /* ignore */ }
                },
                restoreDones() {
                    // PR #405: video_watch silindi — video ✓ session-only-dur
                    // (yalnız düymə klikində yaranır, refresh-dən sonra yenidən klik lazımdır)
                    // PR #406: emp_passed/pen_passed əlavə olundu — checkmark ✓ ilə yanaşı
                    // approve precondition-i (complianceChecked + nəticələr) də bərpa olunur
                    ['compliance_name', 'compliance_hms', 'compliance_os',
                     'emp_req', 'emp_verify', 'emp_passed',
                     'pen_req', 'pen_verify', 'pen_passed'].forEach(k => {
                        let done = false;
                        try { done = localStorage.getItem('alpul_done_' + this.internalId + '_' + k) === '1'; } catch (e) { /* ignore */ }
                        if (done) this.markDone(k);
                    });
                    // PR #407: köhnə sessiya datası — PR #406-dan ƏVVƏL verify edilən
                    // müraciətlərdə emp_passed/pen_passed açarı yoxdur (yalnız emp_verify/
                    // pen_verify var). Müraciət hələ pending-dirsə, verify rejected olsaydı
                    // avtomatik rejected olardı (PR #238/#242) — demək nəticə passed olub.
                    // Bu halda nəticəni çıxarış edirik ki ✓ ilə precondition sinxron olsun.
                    const isPending = this.app?.status === 'pending_approval' || this.app?.status === 'pending_expert';
                    if (isPending) {
                        if (!this.employmentResult && this.employmentVerified) this.employmentResult = 'passed';
                        if (!this.pensionResult && this.pensionVerified) this.pensionResult = 'passed';
                    }
                },

                async load() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.id);
                        if (!resp.ok) throw new Error('Muraciet tapilmadi');
                        this.app = await resp.json();

                        // Load existing contacts if present
                        // PR #136: normalizeRelation — köhnə DB dəyərlərini yeni formaya çevir (Ata → Atası)
                        // PR #136: name-i trim et — DB-də boşluqlu gələ bilər
                        if (this.app.contact1_phone || this.app.contact1_relation) {
                            const rel1 = this.normalizeRelation(this.app.contact1_relation || '');
                            const name1 = (this.app.contact1_name || '').trim();
                            this.contacts[0] = {
                                relation: rel1,
                                phone: this.app.contact1_phone || '',
                                name: name1,
                                saved: true, saving: false,
                                savedPhone: this.app.contact1_phone || '',
                                savedRelation: rel1,
                                savedName: name1,
                                verified: this.app.contact1_verified === true ? true : (this.app.contact1_verified === false ? false : null),
                                callNote: this.app.contact1_call_note || '',
                                noteSaving: false, noteSaved: false,
                                editing: false
                            };
                        }
                        if (this.app.contact2_phone || this.app.contact2_relation) {
                            const rel2 = this.normalizeRelation(this.app.contact2_relation || '');
                            const name2 = (this.app.contact2_name || '').trim();
                            this.contacts[1] = {
                                relation: rel2,
                                phone: this.app.contact2_phone || '',
                                name: name2,
                                saved: true, saving: false,
                                savedPhone: this.app.contact2_phone || '',
                                savedRelation: rel2,
                                savedName: name2,
                                verified: this.app.contact2_verified === true ? true : (this.app.contact2_verified === false ? false : null),
                                callNote: this.app.contact2_call_note || '',
                                noteSaving: false, noteSaved: false,
                                editing: false
                            };
                        }
                        if (this.app.contact3_phone || this.app.contact3_relation) {
                            const rel3 = this.normalizeRelation(this.app.contact3_relation || '');
                            const name3 = (this.app.contact3_name || '').trim();
                            this.contacts[2] = {
                                relation: rel3,
                                phone: this.app.contact3_phone || '',
                                name: name3,
                                saved: true, saving: false,
                                savedPhone: this.app.contact3_phone || '',
                                savedRelation: rel3,
                                savedName: name3,
                                verified: this.app.contact3_verified === true ? true : (this.app.contact3_verified === false ? false : null),
                                callNote: this.app.contact3_call_note || '',
                                noteSaving: false, noteSaved: false,
                                editing: false
                            };
                        }

                        // PR #245: qeydiyyat ünvanı boşdursa AZMK-dən doldur (arxa fonda, blocking deyil)
                        this.backfillRegistrationAddress();

                        // PR #402/#405: addım checkmark-larını bərpa et (komplayans/MyGov)
                        // + backend video_required oxu — YALNIZ approve qadağası üçün,
                        // ✓ göstərmək üçün YOX (PR #405: ✓ yalnız düymə klikində).
                        this.restoreDones();
                        if (this.app.public_id) {
                            fetch('/api/applications/' + this.app.public_id + '/video-record')
                                .then(r => r.ok ? r.json() : null)
                                .then(d => {
                                    if (!d) return;
                                    this.videoBackendRequired = !!d.video_required;
                                    // PR #440: DB statusundan gözləmə vəziyyəti — son order
                                    // hələ çəkilməyibsə panel xəbərdarlığı göstərilir
                                    // (dəqiq status dialoq açılanda service-dən yenilənir).
                                    this.videoPendingNew = !!d.video_required && !d.recorded;
                                    // PR #449: video axını olan müraciətdirsə stream URL-i
                                    // arxa fonda prefetch et — klikdə dialoq ani açılsın
                                    // (xarici status check backend-də artıq keçilir)
                                    if (d.video_required) this.prefetchVideoStreamUrl();
                                })
                                .catch(() => { /* fail-soft */ });
                        }

                        // PR #408: müştəri şəkli — AZMK PersonalInfo Image tagı (fail-soft,
                        // backend-də cache varsa oradan).
                        // PR #409 (MÜVƏQQƏTİ): Image tagı gəlməsə də NÜMUNƏ şəkil göstərilir
                        // (UI-u baxmaq üçün) — PR #410-da bu fallback silinəcək.
                        if (this.internalId) {
                            fetch('/api/applications/' + this.internalId + '/customer-photo')
                                .then(r => r.ok ? r.json() : null)
                                .then(d => {
                                    if (d && d.image) this.customerPhoto = 'data:image/jpeg;base64,' + d.image;
                                    else this.customerPhoto = '/assets/sample-customer-photo.jpg';
                                })
                                .catch(() => { this.customerPhoto = '/assets/sample-customer-photo.jpg'; });
                        }
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                        // PR #134/#225: Timer — pending_approval və pending_expert statusunda başlat
                        if (this.app && (this.app.status === 'pending_approval' || this.app.status === 'pending_expert') && !this.timerStopped) {
                            this.startTimer();
                        } else if (this.app && (this.app.status === 'approved' || this.app.status === 'rejected' || this.app.status === 'pending_signature' || this.app.status === 'disbursed' || this.app.status === 'disbursing' || this.app.status === 'disburse_failed')) {
                            this.stopTimer();
                        }
                    }
                },

                async approve() {
                    this.actionLoading = true;
                    this.actionMessage = '';
                    this.actionError = '';

                    // PR #134: Precondition yoxlamaları
                    const errors = this.checkApprovePreconditions();
                    if (errors.length > 0) {
                        this.actionError = 'Təsdiq edilə bilməz:\n• ' + errors.join('\n• ');
                        this.actionLoading = false;
                        return; // Timer dayanmır
                    }

                    try {
                        const resp = await fetch('/api/expert/' + this.internalId + '/approve', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ credit_level: this.app.credit_level || 'new' })
                        });
                        if (!resp.ok) {
                            const err = await resp.json();
                            throw new Error(err.error || 'Tesdiq ugursuz');
                        }
                        this.actionMessage = 'Muraciet tesdiq edildi!';
                        this.stopTimer(); // PR #134: təsdiq uğurlu — timer dayan
                        await this.load();
                    } catch (e) {
                        this.actionError = e.message;
                        // Timer dayanmır — xəta var, ekspert yenidən cəhd edə bilər
                    } finally {
                        this.actionLoading = false;
                    }
                },

                async reject() {
                    this.actionLoading = true;
                    this.actionMessage = '';
                    this.actionError = '';
                    try {
                        const resp = await fetch('/api/expert/' + this.internalId + '/reject', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ reason: this.rejectReason })
                        });
                        if (!resp.ok) {
                            const err = await resp.json();
                            throw new Error(err.error || 'Imtina ugursuz');
                        }
                        this.actionMessage = 'Muraciet imtina edildi.';
                        this.stopTimer(); // PR #134: imtina uğurlu — timer dayan
                        await this.load();
                        // PR #442/#444: imtinadan sonra birbaşa "İmtina olunmuş" siyahısına
                        // yönləndir — /dashboard map-də mövcuddur (/index 404 verirdi)
                        setTimeout(() => window.location.href = '/dashboard?tab=rejected', 800);
                    } catch (e) {
                        this.actionError = e.message;
                    } finally {
                        this.actionLoading = false;
                    }
                },

                // PR #415: düymə cooldown-u — klikdən sonra 10 san geri sayım; bitəndə
                // düymə yenidən aktivləşir. Nəticə 'passed' olsa cooldown lazımsızdır
                // (:disabled içində employmentResult/pensionResult === 'passed' şərti
                // düymələri tam deaktiv saxlayır).
                startCooldown(key) {
                    if (this.cooldownTimers[key]) return;
                    this.mygovCooldown[key] = 10;
                    this.cooldownTimers[key] = setInterval(() => {
                        this.mygovCooldown[key]--;
                        if (this.mygovCooldown[key] <= 0) {
                            clearInterval(this.cooldownTimers[key]);
                            this.cooldownTimers[key] = null;
                        }
                    }, 1000);
                },

                // MyGov employment
                async employmentRequest() {
                    this.startCooldown('empReq'); // PR #415
                    this.employmentLoading = true;
                    this.employmentMessage = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/mygov-employment-request', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Sorgu gonderilmedi');
                        this.employmentMessage = 'SMS gonderildi.';
                        this.employmentResult = '';
                        this.markDone('emp_req'); // PR #402: ✓
                    } catch (e) {
                        this.employmentMessage = 'Xeta: ' + e.message;
                    } finally {
                        this.employmentLoading = false;
                    }
                },

                async employmentVerify() {
                    this.startCooldown('empVerify'); // PR #415
                    this.employmentVerifying = true;
                    this.employmentMessage = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/mygov-employment-verify', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Yoxlama ugursuz');
                        this.employmentResult = data.status;
                        this.employmentMessage = data.reason;
                        this.markDone('emp_verify'); // PR #402: ✓ (nəticədən asılı olmayaraq yoxlanılıb)
                        if (data.status === 'passed') this.markDone('emp_passed'); // PR #406: precondition bərpası üçün
                        // PR #238: EMPLOYMENT_TENURE cutoff-a düşdü → imtina dialoqu göstər.
                        // Dialoq bağlananda closeEmpRejectModal() müraciəti yeniləyir —
                        // backend artıq auto-reject edib (müraciət sonlanıb), dashboard-da
                        // rejected statusu ilə görünür.
                        if (data.status === 'rejected') {
                            this.empRejectModalReason = data.reason || 'EMPLOYMENT_TENURE';
                            this.empRejectModalOpen = true;
                        }
                    } catch (e) {
                        this.employmentMessage = 'Xeta: ' + e.message;
                    } finally {
                        this.employmentVerifying = false;
                    }
                },

                // PR #238: imtina dialoqunu bağla və müraciəti yenilə (rejected statusu əks olunsun)
                async closeEmpRejectModal() {
                    this.empRejectModalOpen = false;
                    this.empRejectModalReason = '';
                    await this.load();
                },

                // MyGov pension
                async pensionRequest() {
                    this.startCooldown('penReq'); // PR #415
                    this.pensionLoading = true;
                    this.pensionMessage = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/mygov-pension-request', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Sorgu gonderilmedi');
                        this.pensionMessage = 'SMS gonderildi.';
                        this.pensionResult = '';
                        this.markDone('pen_req'); // PR #402: ✓
                    } catch (e) {
                        this.pensionMessage = 'Xeta: ' + e.message;
                    } finally {
                        this.pensionLoading = false;
                    }
                },

                async pensionVerify() {
                    this.startCooldown('penVerify'); // PR #415
                    this.pensionVerifying = true;
                    this.pensionMessage = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/mygov-pension-verify', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Yoxlama ugursuz');
                        this.pensionResult = data.status;
                        this.pensionMessage = data.reason;
                        this.markDone('pen_verify'); // PR #402: ✓
                        if (data.status === 'passed') this.markDone('pen_passed'); // PR #406: precondition bərpası üçün
                        if (data.status === 'rejected') await this.load();
                    } catch (e) {
                        this.pensionMessage = 'Xeta: ' + e.message;
                    } finally {
                        this.pensionVerifying = false;
                    }
                },

                // PR #399: "Video müraciət göndər" — order yaradılır, redirect_url SMS-lə gedir
                async videoRequest() {
                    this.videoLoading = true;
                    this.videoMessage = '';
                    this.videoError = false;
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/video-request', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'SMS gonderilmedi');
                        this.videoMessage = 'SMS göndərildi — müştəri linke keçid edərək yeni video çəkəcək. Yeni video çəkilənə qədər video baxışı və təsdiq bloklanır.';
                        this.videoOrderSent = true; // PR #405: ✓ yalnız klikdə (session-only)
                        // PR #436: yeni order göndərildi — baxış statusu RESET olunur.
                        // Köhnə videoya baxılmış olsa belə yeni video çəkilənə qədər
                        // approve bloklanır (videoWatched yalnız yeni video REAL
                        // yüklənəndə — loadeddata — true olur).
                        this.videoWatched = false;
                        this.videoStreamUrl = '';
                        this.videoStreamError = '';
                        // PR #449: köhnə prefetch-i keçərsizləşdir — yeni order üçün
                        // URL fərqlidir (yeni app_id), klik zamanı təzədən alınacaq
                        this.videoStreamUrlReady = '';
                        // PR #440: panel xəbərdarlığı — yeni video gözlənilir
                        this.videoPendingNew = true;
                    } catch (e) {
                        this.videoMessage = 'Xeta: ' + e.message;
                        this.videoError = true;
                    } finally {
                        this.videoLoading = false;
                    }
                },

                // PR #449: stream URL-i arxa fonda əvvəlcədən al (klikdən əvvəl).
                // Nəticə videoStreamUrlReady-də saxlanılır; xətalar udulur —
                // klik zamanı adi axın işə düşür.
                async prefetchVideoStreamUrl() {
                    if (this.videoStreamUrlReady || !this.internalId) return;
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/video-stream-url');
                        const data = await resp.json();
                        if (resp.ok && data.stream_url) {
                            this.videoStreamUrlReady = data.stream_url;
                            // PR #440: prefetch uğurludursa video hazırdır
                            this.videoPendingNew = false;
                        }
                    } catch (e) { /* fail-soft — klik zamanı yenidən cəhd olunacaq */ }
                },

                // PR #399: "Videya bax" — stream URL-i alınıb modalda oynadılır
                async openVideoDialog() {
                    this.videoDialogOpen = true;
                    this.videoStreamError = '';
                    // PR #428: hər açılışda dialoq mərkəzə qayıdır
                    this.videoDragging = false;
                    this.videoDragX = 0;
                    this.videoDragY = 0;
                    // PR #449: URL əvvəlcədən alınmışsa — ANINDA göstər
                    if (this.videoStreamUrlReady) {
                        this.videoStreamUrl = this.videoStreamUrlReady;
                        this.videoPendingNew = false;
                        this.videoStreamLoading = false;
                        return;
                    }
                    this.videoStreamUrl = '';
                    this.videoStreamLoading = true;
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/video-stream-url');
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Video tapilmadi');
                        this.videoStreamUrl = data.stream_url;
                        // PR #440: yeni video hazırdır — gözləmə xəbərdarlığı götürülür
                        this.videoPendingNew = false;
                        // PR #405: ✓ BURADA yox — video elementinin loadeddata
                        // hadisəsində qoyulur (video REAL yüklənib oxunanda)
                    } catch (e) {
                        // PR #438: backend mesajları istifadəçi-dostludur
                        // ("yeni video hələ çəkilməyib" və s.) — birbaşa göstərilir.
                        this.videoStreamError = e.message || 'Video açıla bilmədi';
                        // PR #440: "çəkilməyib" xətası = yeni video gözlənilir —
                        // panel xəbərdarlığını da qaldır (dialoq bağlananda qalsın)
                        if ((e.message || '').includes('çəkilməyib')) this.videoPendingNew = true;
                    } finally {
                        this.videoStreamLoading = false;
                    }
                },

                closeVideoDialog() {
                    this.videoDialogOpen = false;
                    const v = document.getElementById('videoVerifyPlayer');
                    if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
                    this.videoStreamUrl = '';
                    this.videoStreamError = '';
                },

                // PR #428: dialoqu başlıqdan sürüşdürmə (drag) — video idarəetmə
                // elementləri ilə konflikt yaratmır (yalnız başlıq tutulur)
                startVideoDrag(e) {
                    this.videoDragging = true;
                    this.videoDragStartX = e.clientX;
                    this.videoDragStartY = e.clientY;
                    this.videoDragOrigX = this.videoDragX;
                    this.videoDragOrigY = this.videoDragY;
                },
                onVideoDrag(e) {
                    if (!this.videoDragging) return;
                    this.videoDragX = this.videoDragOrigX + (e.clientX - this.videoDragStartX);
                    this.videoDragY = this.videoDragOrigY + (e.clientY - this.videoDragStartY);
                },
                endVideoDrag() {
                    this.videoDragging = false;
                },
            }
        }
    </script>

    <script>
        // PR #236: kredit level Azərbaycanca — backend kiçik hərflə qaytarır ('valuable'),
        // ona görə lookup öncə toUpperCase ilə normallaşdırılır (regressiya düzəlişi PR #235-dən)
        function levelAz(level) {
            const map = {
                'NEW': 'Yeni',
                'TRUSTED': 'Etibarlı',
                'VALUABLE': 'Dəyərli',
                'ELITE': 'Elit'
            };
            return map[String(level || '').toUpperCase()] || level;
        }
    </script>
</body>
