                // PR #402: ekspert addım checkmark-ları — localStorage-da app-a görə saxlanılır.
                // Faktiki ünvan ✓ backend audit-dən (actual_address_updated_*), video order ✓
                // backend-dən (video_records) gəlir — qalanı lokal işarələmədir.
                markDone(key) {
                    const map = {
                        compliance_name: () => { this.compliance.name = true; this.complianceChecked = true; }, // PR #406: klik də precondition-i qane edir
                        compliance_hms: () => this.compliance.hms = true,
                        compliance_os: () => this.compliance.os = true,
                        emp_req: () => this.employmentSMSDone = true,
                        emp_verify: () => this.employmentVerified = true,
                        // PR #406: nəticə özü də saxlanılır — siyahıya qayıdıb geri
                        // gələndə approve precondition-i yenidən keçilsin (✓ ilə birgə)
                        emp_passed: () => this.employmentResult = 'passed',
                        pen_req: () => this.pensionSMSDone = true,
                        pen_verify: () => this.pensionVerified = true,
                        pen_passed: () => this.pensionResult = 'passed',
                    };
                    if (map[key]) map[key]();
                    try { localStorage.setItem('alpul_done_' + this.internalId + '_' + key, '1'); } catch (e) { /* ignore */ }
                },
                restoreDones() {
                    // PR #405: video_watch silindi — video ✓ session-only-dur
                    // (yalnız düymə klikində yaranır, refresh-dən sonra yenidən klik lazımdır)
                    // PR #406: emp_passed/pen_passed əlavə olundu — checkmark ✓ ilə yanaşı
                    // approve precondition-i (complianceChecked + nəticələr) də bərpa olunur
                    ['compliance_name', 'compliance_hms', 'compliance_os',
                     'emp_req', 'emp_verify', 'emp_passed',
                     'pen_req', 'pen_verify', 'pen_passed'].forEach(k => {
                        let done = false;
                        try { done = localStorage.getItem('alpul_done_' + this.internalId + '_' + k) === '1'; } catch (e) { /* ignore */ }
                        if (done) this.markDone(k);
                    });
                    // PR #407: köhnə sessiya datası — PR #406-dan ƏVVƏL verify edilən
                    // müraciətlərdə emp_passed/pen_passed açarı yoxdur (yalnız emp_verify/
                    // pen_verify var). Müraciət hələ pending-dirsə, verify rejected olsaydı
                    // avtomatik rejected olardı (PR #238/#242) — demək nəticə passed olub.
                    // Bu halda nəticəni çıxarış edirik ki ✓ ilə precondition sinxron olsun.
                    const isPending = this.app?.status === 'pending_approval' || this.app?.status === 'pending_expert';
                    if (isPending) {
                        if (!this.employmentResult && this.employmentVerified) this.employmentResult = 'passed';
                        if (!this.pensionResult && this.pensionVerified) this.pensionResult = 'passed';
                    }
                },

                async load() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.id);
                        if (!resp.ok) throw new Error('Muraciet tapilmadi');
                        this.app = await resp.json();

                        // Load existing contacts if present
                        // PR #136: normalizeRelation — köhnə DB dəyərlərini yeni formaya çevir (Ata → Atası)
                        // PR #136: name-i trim et — DB-də boşluqlu gələ bilər
                        if (this.app.contact1_phone || this.app.contact1_relation) {
                            const rel1 = this.normalizeRelation(this.app.contact1_relation || '');
                            const name1 = (this.app.contact1_name || '').trim();
                            this.contacts[0] = {
                                relation: rel1,
                                phone: this.app.contact1_phone || '',
                                name: name1,
                                saved: true, saving: false,
                                savedPhone: this.app.contact1_phone || '',
                                savedRelation: rel1,
                                savedName: name1,
                                verified: this.app.contact1_verified === true ? true : (this.app.contact1_verified === false ? false : null),
                                callNote: this.app.contact1_call_note || '',
                                noteSaving: false, noteSaved: false,
                                editing: false
                            };
                        }
                        if (this.app.contact2_phone || this.app.contact2_relation) {
                            const rel2 = this.normalizeRelation(this.app.contact2_relation || '');
                            const name2 = (this.app.contact2_name || '').trim();
                            this.contacts[1] = {
                                relation: rel2,
                                phone: this.app.contact2_phone || '',
                                name: name2,
                                saved: true, saving: false,
                                savedPhone: this.app.contact2_phone || '',
                                savedRelation: rel2,
                                savedName: name2,
                                verified: this.app.contact2_verified === true ? true : (this.app.contact2_verified === false ? false : null),
                                callNote: this.app.contact2_call_note || '',
                                noteSaving: false, noteSaved: false,
                                editing: false
                            };
                        }
                        if (this.app.contact3_phone || this.app.contact3_relation) {
                            const rel3 = this.normalizeRelation(this.app.contact3_relation || '');
                            const name3 = (this.app.contact3_name || '').trim();
                            this.contacts[2] = {
                                relation: rel3,
                                phone: this.app.contact3_phone || '',
                                name: name3,
                                saved: true, saving: false,
                                savedPhone: this.app.contact3_phone || '',
                                savedRelation: rel3,
                                savedName: name3,
                                verified: this.app.contact3_verified === true ? true : (this.app.contact3_verified === false ? false : null),
                                callNote: this.app.contact3_call_note || '',
                                noteSaving: false, noteSaved: false,
                                editing: false
                            };
                        }

                        // PR #245: qeydiyyat ünvanı boşdursa AZMK-dən doldur (arxa fonda, blocking deyil)
                        this.backfillRegistrationAddress();

                        // PR #402/#405: addım checkmark-larını bərpa et (komplayans/MyGov)
                        // + backend video_required oxu — YALNIZ approve qadağası üçün,
                        // ✓ göstərmək üçün YOX (PR #405: ✓ yalnız düymə klikində).
                        this.restoreDones();
                        if (this.app.public_id) {
                            fetch('/api/applications/' + this.app.public_id + '/video-record')
                                .then(r => r.ok ? r.json() : null)
                                .then(d => {
                                    if (!d) return;
                                    this.videoBackendRequired = !!d.video_required;
                                    // PR #440: DB statusundan gözləmə vəziyyəti — son order
                                    // hələ çəkilməyibsə panel xəbərdarlığı göstərilir
                                    // (dəqiq status dialoq açılanda service-dən yenilənir).
                                    this.videoPendingNew = !!d.video_required && !d.recorded;
                                })
                                .catch(() => { /* fail-soft */ });
                        }

                        // PR #408: müştəri şəkli — AZMK PersonalInfo Image tagı (fail-soft,
                        // backend-də cache varsa oradan).
                        // PR #409 (MÜVƏQQƏTİ): Image tagı gəlməsə də NÜMUNƏ şəkil göstərilir
                        // (UI-u baxmaq üçün) — PR #410-da bu fallback silinəcək.
                        if (this.internalId) {
                            fetch('/api/applications/' + this.internalId + '/customer-photo')
                                .then(r => r.ok ? r.json() : null)
                                .then(d => {
                                    if (d && d.image) this.customerPhoto = 'data:image/jpeg;base64,' + d.image;
                                    else this.customerPhoto = '/assets/sample-customer-photo.jpg';
                                })
                                .catch(() => { this.customerPhoto = '/assets/sample-customer-photo.jpg'; });
                        }
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                        // PR #134/#225: Timer — pending_approval və pending_expert statusunda başlat
                        if (this.app && (this.app.status === 'pending_approval' || this.app.status === 'pending_expert') && !this.timerStopped) {
                            this.startTimer();
                        } else if (this.app && (this.app.status === 'approved' || this.app.status === 'rejected' || this.app.status === 'pending_signature' || this.app.status === 'disbursed' || this.app.status === 'disbursing' || this.app.status === 'disburse_failed')) {
                            this.stopTimer();
                        }
                    }
                },

                async approve() {
                    this.actionLoading = true;
                    this.actionMessage = '';
                    this.actionError = '';

                    // PR #134: Precondition yoxlamaları
                    const errors = this.checkApprovePreconditions();
                    if (errors.length > 0) {
                        this.actionError = 'Təsdiq edilə bilməz:\n• ' + errors.join('\n• ');
                        this.actionLoading = false;
                        return; // Timer dayanmır
                    }

                    try {
                        const resp = await fetch('/api/expert/' + this.internalId + '/approve', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ credit_level: this.app.credit_level || 'new' })
                        });
                        if (!resp.ok) {
                            const err = await resp.json();
                            throw new Error(err.error || 'Tesdiq ugursuz');
                        }
                        this.actionMessage = 'Muraciet tesdiq edildi!';
                        this.stopTimer(); // PR #134: təsdiq uğurlu — timer dayan
                        await this.load();
                    } catch (e) {
                        this.actionError = e.message;
                        // Timer dayanmır — xəta var, ekspert yenidən cəhd edə bilər
                    } finally {
                        this.actionLoading = false;
                    }
                },

                async reject() {
                    this.actionLoading = true;
                    this.actionMessage = '';
                    this.actionError = '';
                    try {
                        const resp = await fetch('/api/expert/' + this.internalId + '/reject', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ reason: this.rejectReason })
                        });
                        if (!resp.ok) {
                            const err = await resp.json();
                            throw new Error(err.error || 'Imtina ugursuz');
                        }
                        this.actionMessage = 'Muraciet imtina edildi.';
                        this.stopTimer(); // PR #134: imtina uğurlu — timer dayan
                        await this.load();
                        // PR #442/#444: imtinadan sonra birbaşa "İmtina olunmuş" siyahısına
                        // yönləndir — /dashboard map-də mövcuddur (/index 404 verirdi)
                        setTimeout(() => window.location.href = '/dashboard?tab=rejected', 800);
                    } catch (e) {
                        this.actionError = e.message;
                    } finally {
                        this.actionLoading = false;
                    }
                },

                // PR #415: düymə cooldown-u — klikdən sonra 10 san geri sayım; bitəndə
                // düymə yenidən aktivləşir. Nəticə 'passed' olsa cooldown lazımsızdır
                // (:disabled içində employmentResult/pensionResult === 'passed' şərti
                // düymələri tam deaktiv saxlayır).
                startCooldown(key) {
                    if (this.cooldownTimers[key]) return;
                    this.mygovCooldown[key] = 10;
                    this.cooldownTimers[key] = setInterval(() => {
                        this.mygovCooldown[key]--;
                        if (this.mygovCooldown[key] <= 0) {
                            clearInterval(this.cooldownTimers[key]);
                            this.cooldownTimers[key] = null;
                        }
                    }, 1000);
                },

                // MyGov employment
                async employmentRequest() {
                    this.startCooldown('empReq'); // PR #415
                    this.employmentLoading = true;
                    this.employmentMessage = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/mygov-employment-request', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Sorgu gonderilmedi');
                        this.employmentMessage = 'SMS gonderildi.';
                        this.employmentResult = '';
                        this.markDone('emp_req'); // PR #402: ✓
                    } catch (e) {
                        this.employmentMessage = 'Xeta: ' + e.message;
                    } finally {
                        this.employmentLoading = false;
                    }
                },

                async employmentVerify() {
                    this.startCooldown('empVerify'); // PR #415
                    this.employmentVerifying = true;
                    this.employmentMessage = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/mygov-employment-verify', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Yoxlama ugursuz');
                        this.employmentResult = data.status;
                        this.employmentMessage = data.reason;
                        this.markDone('emp_verify'); // PR #402: ✓ (nəticədən asılı olmayaraq yoxlanılıb)
                        if (data.status === 'passed') this.markDone('emp_passed'); // PR #406: precondition bərpası üçün
                        // PR #238: EMPLOYMENT_TENURE cutoff-a düşdü → imtina dialoqu göstər.
                        // Dialoq bağlananda closeEmpRejectModal() müraciəti yeniləyir —
                        // backend artıq auto-reject edib (müraciət sonlanıb), dashboard-da
                        // rejected statusu ilə görünür.
                        if (data.status === 'rejected') {
                            this.empRejectModalReason = data.reason || 'EMPLOYMENT_TENURE';
                            this.empRejectModalOpen = true;
                        }
                    } catch (e) {
                        this.employmentMessage = 'Xeta: ' + e.message;
                    } finally {
                        this.employmentVerifying = false;
                    }
                },

                // PR #238: imtina dialoqunu bağla və müraciəti yenilə (rejected statusu əks olunsun)
                async closeEmpRejectModal() {
                    this.empRejectModalOpen = false;
                    this.empRejectModalReason = '';
                    await this.load();
                },

                // MyGov pension
                async pensionRequest() {
                    this.startCooldown('penReq'); // PR #415
                    this.pensionLoading = true;
                    this.pensionMessage = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/mygov-pension-request', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Sorgu gonderilmedi');
                        this.pensionMessage = 'SMS gonderildi.';
                        this.pensionResult = '';
                        this.markDone('pen_req'); // PR #402: ✓
                    } catch (e) {
                        this.pensionMessage = 'Xeta: ' + e.message;
                    } finally {
                        this.pensionLoading = false;
                    }
                },

                async pensionVerify() {
                    this.startCooldown('penVerify'); // PR #415
                    this.pensionVerifying = true;
                    this.pensionMessage = '';
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/mygov-pension-verify', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Yoxlama ugursuz');
                        this.pensionResult = data.status;
                        this.pensionMessage = data.reason;
                        this.markDone('pen_verify'); // PR #402: ✓
                        if (data.status === 'passed') this.markDone('pen_passed'); // PR #406: precondition bərpası üçün
                        if (data.status === 'rejected') await this.load();
                    } catch (e) {
                        this.pensionMessage = 'Xeta: ' + e.message;
                    } finally {
                        this.pensionVerifying = false;
                    }
                },

                // PR #399: "Video müraciət göndər" — order yaradılır, redirect_url SMS-lə gedir
                async videoRequest() {
                    this.videoLoading = true;
                    this.videoMessage = '';
                    this.videoError = false;
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/video-request', { method: 'POST' });
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'SMS gonderilmedi');
                        this.videoMessage = 'SMS göndərildi — müştəri linke keçid edərək yeni video çəkəcək. Yeni video çəkilənə qədər video baxışı və təsdiq bloklanır.';
                        this.videoOrderSent = true; // PR #405: ✓ yalnız klikdə (session-only)
                        // PR #436: yeni order göndərildi — baxış statusu RESET olunur.
                        // Köhnə videoya baxılmış olsa belə yeni video çəkilənə qədər
                        // approve bloklanır (videoWatched yalnız yeni video REAL
                        // yüklənəndə — loadeddata — true olur).
                        this.videoWatched = false;
                        this.videoStreamUrl = '';
                        this.videoStreamError = '';
                        // PR #440: panel xəbərdarlığı — yeni video gözlənilir
                        this.videoPendingNew = true;
                    } catch (e) {
                        this.videoMessage = 'Xeta: ' + e.message;
                        this.videoError = true;
                    } finally {
                        this.videoLoading = false;
                    }
                },

                // PR #399: "Videya bax" — stream URL-i alınıb modalda oynadılır
                async openVideoDialog() {
                    this.videoDialogOpen = true;
                    this.videoStreamUrl = '';
                    this.videoStreamError = '';
                    this.videoStreamLoading = true;
                    // PR #428: hər açılışda dialoq mərkəzə qayıdır
                    this.videoDragging = false;
                    this.videoDragX = 0;
                    this.videoDragY = 0;
                    try {
                        const resp = await fetch('/api/applications/' + this.internalId + '/video-stream-url');
                        const data = await resp.json();
                        if (!resp.ok) throw new Error(data.error || 'Video tapilmadi');
                        this.videoStreamUrl = data.stream_url;
                        // PR #440: yeni video hazırdır — gözləmə xəbərdarlığı götürülür
                        this.videoPendingNew = false;
                        // PR #405: ✓ BURADA yox — video elementinin loadeddata
                        // hadisəsində qoyulur (video REAL yüklənib oxunanda)
                    } catch (e) {
                        // PR #438: backend mesajları istifadəçi-dostludur
                        // ("yeni video hələ çəkilməyib" və s.) — birbaşa göstərilir.
                        this.videoStreamError = e.message || 'Video açıla bilmədi';
                        // PR #440: "çəkilməyib" xətası = yeni video gözlənilir —
                        // panel xəbərdarlığını da qaldır (dialoq bağlananda qalsın)
                        if ((e.message || '').includes('çəkilməyib')) this.videoPendingNew = true;
                    } finally {
                        this.videoStreamLoading = false;
                    }
                },

                closeVideoDialog() {
                    this.videoDialogOpen = false;
                    const v = document.getElementById('videoVerifyPlayer');
                    if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
                    this.videoStreamUrl = '';
                    this.videoStreamError = '';
                },

                // PR #428: dialoqu başlıqdan sürüşdürmə (drag) — video idarəetmə
                // elementləri ilə konflikt yaratmır (yalnız başlıq tutulur)
                startVideoDrag(e) {
                    this.videoDragging = true;
                    this.videoDragStartX = e.clientX;
                    this.videoDragStartY = e.clientY;
                    this.videoDragOrigX = this.videoDragX;
                    this.videoDragOrigY = this.videoDragY;
                },
                onVideoDrag(e) {
                    if (!this.videoDragging) return;
                    this.videoDragX = this.videoDragOrigX + (e.clientX - this.videoDragStartX);
                    this.videoDragY = this.videoDragOrigY + (e.clientY - this.videoDragStartY);
                },
                endVideoDrag() {
                    this.videoDragging = false;
                },
            }
        }
    </script>

    <script>
        // PR #236: kredit level Azərbaycanca — backend kiçik hərflə qaytarır ('valuable'),
        // ona görə lookup öncə toUpperCase ilə normallaşdırılır (regressiya düzəlişi PR #235-dən)
        function levelAz(level) {
            const map = {
                'NEW': 'Yeni',
                'TRUSTED': 'Etibarlı',
                'VALUABLE': 'Dəyərli',
                'ELITE': 'Elit'
            };
            return map[String(level || '').toUpperCase()] || level;
        }
    </script>
</body>
